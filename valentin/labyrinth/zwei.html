<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Das Heckenlabyrinth — zu zweit</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #0a0908; color: #ded6c2;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    overflow: hidden; }
  #huelle { height: 100%; display: flex; flex-direction: column; }
  #kopf { flex: none; display: flex; align-items: baseline; gap: 16px;
    padding: 6px 14px; background: #131210; border-bottom: 1px solid #262218;
    font-size: 13px; color: #8a857a; }
  #kopf b { color: #f0c173; font-weight: 600; font-size: 15px; }
  #platz { flex: 1; display: flex; min-height: 0; }
  .seite { flex: 1 1 50%; position: relative; min-width: 0; display: flex;
    flex-direction: column; }
  .seite + .seite { border-left: 2px solid #262218; }
  .schild { flex: none; padding: 5px 12px; font-size: 12px; letter-spacing: .06em;
    text-transform: uppercase; color: #8a857a; background: #0f0e0c; }
  .schild b { color: #f0c173; text-transform: none; letter-spacing: 0; font-size: 14px; }
  canvas { flex: 1; width: 100%; min-height: 0; display: block; }
  .verlauf { flex: none; height: 104px; overflow-y: auto; padding: 6px 10px;
    background: #0d0c0a; border-top: 1px solid #262218; font-size: 13px;
    line-height: 1.45; }
  .verlauf div { margin-bottom: 2px; color: #ded6c2; }
  .verlauf b { font-weight: 600; margin-right: 5px; }
  .verlauf .ich b { color: #8fd49a; }
  .verlauf .er b  { color: #f0c173; }
  .verlauf .ereignis { color: #8a857a; font-style: italic; }
  .reden { flex: none; display: flex; gap: 6px; padding: 7px 10px;
    background: #0f0e0c; border-top: 1px solid #262218; }
  .reden input { flex: 1; min-width: 0; background: #131210; color: #ded6c2;
    border: 1px solid #332f24; border-radius: 6px; padding: 7px 10px; font: inherit; }
  .reden button { padding: 7px 14px; background: #3a2f12; color: #f0c173;
    border: 1px solid #5a4a1c; border-radius: 6px; font: inherit; cursor: pointer; }
  #tafel { position: absolute; inset: 0; z-index: 9; display: flex;
    align-items: center; justify-content: center; padding: 24px;
    background: rgba(10,9,8,0.94); }
  #tafel.weg { display: none; }
  #karte { max-width: 520px; width: 100%; background: rgba(16,14,11,0.98);
    border: 1px solid #5a4a1c; border-radius: 12px; padding: 22px 24px; }
  #karte h1 { margin: 0 0 10px; font-size: 19px; font-weight: 500; color: #f0c173; }
  #karte p { margin: 0 0 12px; font-size: 15px; line-height: 1.55; }
  #karte table { width: 100%; border-collapse: collapse; margin: 0 0 14px; font-size: 14px; }
  #karte td { padding: 4px 0; }
  #karte td:last-child { text-align: right; color: #8a857a; }
  #karte button { padding: 9px 18px; margin: 4px 6px 0 0; background: #3a2f12;
    color: #f0c173; border: 1px solid #5a4a1c; border-radius: 6px;
    font-size: 15px; cursor: pointer; }
</style>
</head>
<body>
<div id="huelle">
  <div id="kopf"><b id="kopf-stand">—</b><span id="kopf-hinweis"></span></div>
  <div id="platz">
    <div class="seite">
      <div class="schild"><b>Im Labyrinth</b> &nbsp; W vor, S zurück, A und D drehen</div>
      <canvas id="sicht"></canvas>
      <div class="verlauf" id="verlauf-laeufer"></div>
      <div class="reden">
        <input id="ruf" maxlength="80" placeholder="Schreiben und Enter">
        <button id="rufen">Senden</button>
      </div>
    </div>
    <div class="seite">
      <div class="schild"><b>Am Monitor</b> &nbsp; klicken markiert ein Feld</div>
      <canvas id="plan"></canvas>
      <div class="verlauf" id="verlauf-monitor"></div>
      <div class="reden">
        <input id="durchsage" maxlength="80" placeholder="Schreiben und Enter">
        <button id="senden">Senden</button>
      </div>
    </div>
  </div>
  <div id="tafel"><div id="karte"></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function () {
  'use strict';

  // ====================================================================
  // Das Heckenlabyrinth
  //
  //   Einer läuft, einer führt. Der Läufer sieht nur den Gang vor sich
  //   und die Fallen, sobald er davorsteht. Der Führende sieht das
  //   ganze Labyrinth von oben und wo der Läufer steckt, aber keine
  //   einzige Falle.
  //
  //   Gesprochen wird in eine Richtung: der Führende sagt durch, der
  //   Läufer liest mit und kann nicht antworten. Wenn der Läufer vor
  //   einer Falle stehen bleibt und umkehrt, muss der Führende das aus
  //   seiner Bewegung lesen und einen anderen Weg suchen. Dafür kann er
  //   sich Felder auf seinem Plan markieren.
  //
  //   Diese Seite zeigt beide Hälften nebeneinander zum Alleintesten.
  //   Im Haus sitzen die beiden in verschiedenen Räumen — der Läufer
  //   hinter dem Tor im Garten, der Führende an den Bildschirmen im
  //   Geheimraum.
  // ====================================================================

  const FELDER   = 12;        // Kantenlänge des Labyrinths
  const FALLEN   = 10;        // so viele Fallen werden gestreut
  const SCHLEIFEN = 0.22;     // Anteil zusätzlich geöffneter Wände
  const SICHT    = 2;         // so viele Felder weit sieht der Läufer
  const SCHRITT  = 170;       // Millisekunden für einen Schritt

  // Der Gärtner geht durchs Labyrinth und schneidet sich ab und zu
  // hindurch. Wer ihm in die Arme läuft, steht wieder am Eingang. Der
  // Führende sieht ihn auf dem Plan, der Läufer erst, wenn er im Gang vor
  // ihm steht — und hört ihn, wenn er nah ist.
  //
  // Alle Zeiten sind danach bemessen, dass sich die beiden tippend
  // verständigen. Eine Ansage zu schreiben, zu lesen und umzusetzen
  // dauert gut zehn Sekunden. Was der Führende ansagen soll, muss also
  // länger stehen bleiben als das — sonst ist jede Warnung falsch,
  // sobald sie ankommt.
  const GEGNER_ZAHL   = 1;
  const GEGNER_TAKT   = 3000;    // Millisekunden je Schritt
  const GEGNER_HOERT  = 2;       // ab so vielen Feldern hört man ihn
  const SCHNITT_JEDER = 4;       // bei jedem wievielten Schritt er schneidet
  const SCHNITT_OFFEN = 60000;   // so lange bleibt ein Schnitt offen
  const WANDEL_ZEIGT  = 8000;    // so lange blinkt eine Änderung auf dem Plan

  // Zusätzlich verschiebt sich ab und zu eine Hecke von selbst. Der
  // Gärtner schneidet nur dort, wo er gerade ist — alles andere bliebe
  // sonst so, wie der Läufer es sich gemerkt hat.
  //
  // Eine einzelne Hecke, selten. Vorher waren es drei alle fünfzehn
  // Sekunden, und dabei gingen die Ansagen unter: Bis „links ist jetzt
  // zu" getippt war, hatte sich schon das Nächste verschoben.
  // WANDEL_TAKT auf 0 schaltet es ab.
  const WANDEL_TAKT  = 40000;    // Millisekunden zwischen zwei Verschiebungen
  const WANDEL_NAEHE = 3;        // nur so weit vom Läufer entfernt

  // Wer im Labyrinth läuft, steht auf dem Plan als Kopf seiner Figur.
  // kopf ist der Ausschnitt aus dem Stehbild, in Anteilen der Bildbreite
  // und -höhe: links, oben, breit, hoch. Er muss quadratisch sein, sonst
  // wird das Gesicht im runden Rahmen verzogen.
  const FIGUREN = {
    chase: { name: 'Delsyn', bild: '../bilder/figuren/figur1-stehen.webp',
             kopf: [25 / 319, 55 / 480, 240 / 319, 240 / 480] },
    logan: { name: 'Logan', bild: '../bilder/figuren/figur2-stehen.webp',
             kopf: [0 / 235, 20 / 480, 220 / 235, 220 / 480] }
  };
  const adresse = new URLSearchParams(location.search);
  const WER = FIGUREN[adresse.get('figur')] ? adresse.get('figur') : 'chase';

  // Welche Hälfte wird gezeigt? Ohne Angabe beide, zum Alleintesten.
  // Im Haus sitzen die beiden an verschiedenen Orten: der Läufer hinter
  // dem Tor im Garten, der Führende oben auf der Dachterrasse.
  //   ?rolle=laeufer   nur der Gang
  //   ?rolle=monitor   nur der Blick von oben
  const ROLLE = ['laeufer', 'monitor'].includes(adresse.get('rolle'))
    ? adresse.get('rolle') : 'beide';

  // Auf dem Plan steht der Kopf dessen, der unten läuft. Wer oben
  // zusieht, sieht also den Kopf seines Partners und nicht seinen
  // eigenen. Kennt die Seite die Figur nicht, bleibt der goldene Punkt.
  const PARTNER = FIGUREN[adresse.get('partner')] ? adresse.get('partner') : null;
  const KOPF_FIGUR = (ROLLE === 'monitor' && PARTNER) ? PARTNER : WER;

  let kopfBild = null;
  (function kopfLaden() {
    const satz = FIGUREN[KOPF_FIGUR];
    if (!satz) return;
    const b = new Image();
    b.onload = () => { kopfBild = b; };
    b.src = satz.bild;
  })();
  const DREHUNG  = 150;       // Millisekunden für eine Vierteldrehung

  // Richtungen: 0 Norden, 1 Osten, 2 Süden, 3 Westen
  const DX = [0, 1, 0, -1];
  const DY = [-1, 0, 1, 0];

  // --------------------------------------------------------------
  // Zufall mit Startwert, damit beide Hälften dasselbe Labyrinth
  // bekommen. Im Haus wird der Startwert über die Verbindung geteilt.
  // --------------------------------------------------------------
  function zufallAus(saat) {
    let z = saat >>> 0;
    return function () {
      z += 0x6D2B79F5;
      let t = z;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // --------------------------------------------------------------
  // Labyrinth bauen. Jedes Feld hat vier Wände; der Tiefensuch-
  // Algorithmus reisst Wände ein, bis alles verbunden ist. Danach
  // kommen ein paar zusätzliche Öffnungen dazu — ohne die gäbe es nur
  // einen einzigen Weg, und der Führende könnte eine Falle nicht
  // umgehen.
  // --------------------------------------------------------------
  function labyrinthBauen(saat) {
    const w = zufallAus(saat);
    const wand = [];
    for (let y = 0; y < FELDER; y++) {
      wand[y] = [];
      for (let x = 0; x < FELDER; x++) wand[y][x] = [true, true, true, true];
    }
    const besucht = [];
    for (let y = 0; y < FELDER; y++) besucht[y] = new Array(FELDER).fill(false);

    const stapel = [[0, 0]];
    besucht[0][0] = true;
    while (stapel.length) {
      const [x, y] = stapel[stapel.length - 1];
      const offen = [];
      for (let r = 0; r < 4; r++) {
        const nx = x + DX[r], ny = y + DY[r];
        if (nx < 0 || ny < 0 || nx >= FELDER || ny >= FELDER) continue;
        if (!besucht[ny][nx]) offen.push(r);
      }
      if (!offen.length) { stapel.pop(); continue; }
      const r = offen[Math.floor(w() * offen.length)];
      const nx = x + DX[r], ny = y + DY[r];
      wand[y][x][r] = false;
      wand[ny][nx][(r + 2) % 4] = false;
      besucht[ny][nx] = true;
      stapel.push([nx, ny]);
    }

    // Zusätzliche Öffnungen für Umwege
    const zusatz = Math.round(FELDER * FELDER * SCHLEIFEN);
    for (let i = 0; i < zusatz; i++) {
      const x = Math.floor(w() * FELDER), y = Math.floor(w() * FELDER);
      const r = Math.floor(w() * 4);
      const nx = x + DX[r], ny = y + DY[r];
      if (nx < 0 || ny < 0 || nx >= FELDER || ny >= FELDER) continue;
      wand[y][x][r] = false;
      wand[ny][nx][(r + 2) % 4] = false;
    }

    // Fallen streuen, aber nicht auf Start und Ziel — und keine, die den
    // Weg ganz zusperrt. Sonst müsste der Läufer hineinlaufen, und das
    // ganze Spiel wäre hinfällig. Deshalb wird nach jeder Falle geprüft,
    // ob das Ziel noch zu erreichen ist, ohne eine Falle zu betreten.
    const falle = [];
    for (let y = 0; y < FELDER; y++) falle[y] = new Array(FELDER).fill(false);

    function zielErreichbar() {
      const gesehen = [];
      for (let y = 0; y < FELDER; y++) gesehen[y] = new Array(FELDER).fill(false);
      const warte = [[0, 0]];
      gesehen[0][0] = true;
      while (warte.length) {
        const [x, y] = warte.pop();
        if (x === FELDER - 1 && y === FELDER - 1) return true;
        for (let r = 0; r < 4; r++) {
          if (wand[y][x][r]) continue;
          const nx = x + DX[r], ny = y + DY[r];
          if (nx < 0 || ny < 0 || nx >= FELDER || ny >= FELDER) continue;
          if (gesehen[ny][nx] || falle[ny][nx]) continue;
          gesehen[ny][nx] = true;
          warte.push([nx, ny]);
        }
      }
      return false;
    }

    let gesetzt = 0, wache = 0;
    while (gesetzt < FALLEN && wache++ < 4000) {
      const x = Math.floor(w() * FELDER), y = Math.floor(w() * FELDER);
      if ((x < 2 && y < 2) || (x > FELDER - 3 && y > FELDER - 3)) continue;
      if (falle[y][x]) continue;
      falle[y][x] = true;
      if (zielErreichbar()) gesetzt++;
      else falle[y][x] = false;      // diese Falle sperrt alles ab
    }
    return { wand, falle, ziel: [FELDER - 1, FELDER - 1] };
  }

  // Ist das Ziel von hier aus erreichbar, ohne eine Falle zu betreten?
  // Dieselbe Prüfung wie beim Setzen der Fallen, nur von einem beliebigen
  // Feld aus. Jede Heckenverschiebung muss sie bestehen, sonst wird der
  // Läufer eingemauert oder das Ziel unerreichbar.
  function zielErreichbarVon(lab, sx, sy) {
    const gesehen = [];
    for (let y = 0; y < FELDER; y++) gesehen[y] = new Array(FELDER).fill(false);
    const warte = [[sx, sy]];
    gesehen[sy][sx] = true;
    while (warte.length) {
      const [x, y] = warte.pop();
      if (x === FELDER - 1 && y === FELDER - 1) return true;
      for (let r = 0; r < 4; r++) {
        if (lab.wand[y][x][r]) continue;
        const nx = x + DX[r], ny = y + DY[r];
        if (nx < 0 || ny < 0 || nx >= FELDER || ny >= FELDER) continue;
        if (gesehen[ny][nx] || lab.falle[ny][nx]) continue;
        gesehen[ny][nx] = true;
        warte.push([nx, ny]);
      }
    }
    return false;
  }

  // Eine bestimmte Hecke öffnen oder schliessen. Beim Schliessen wird
  // geprüft, ob das Ziel danach noch erreichbar ist und der Läufer nicht
  // eingemauert wird — beim Öffnen kann das nie passieren.
  function heckeSetzen(lab, x, y, r, schliessen, sx, sy) {
    const nx = x + DX[r], ny = y + DY[r];
    if (nx < 0 || ny < 0 || nx >= FELDER || ny >= FELDER) return false;
    if (lab.wand[y][x][r] === schliessen) return false;
    lab.wand[y][x][r] = schliessen;
    lab.wand[ny][nx][(r + 2) % 4] = schliessen;
    if (!schliessen) return true;
    const eingemauert = lab.wand[sy][sx].every((w) => w);
    if (!eingemauert && zielErreichbarVon(lab, sx, sy)) return true;
    lab.wand[y][x][r] = false;
    lab.wand[ny][nx][(r + 2) % 4] = false;
    return false;
  }

  function wandDa(lab, x, y, r) {
    if (x < 0 || y < 0 || x >= FELDER || y >= FELDER) return true;
    return lab.wand[y][x][r];
  }

  // --------------------------------------------------------------
  // Zustand
  // --------------------------------------------------------------
  let lab = null;
  let saat = 1;
  let laeufer = { x: 0, y: 0, r: 1 };     // Feld und Blickrichtung
  let gleit = { von: null, bis: null, start: 0, art: null };
  let marken = [];                        // was der Führende angezeichnet hat
  // Ein gemeinsamer Verlauf für beide Seiten. Die letzten Zeilen stehen
  // unter dem Bild, die jüngste Nachricht des anderen zusätzlich gross
  // im Bild, damit man sie beim Laufen nicht übersieht.
  const VERLAUF_LAENGE = 20;
  let verlauf = [];                       // { wer, name, text }
  let durchsage = { text: '', bis: 0 };   // die jüngste Nachricht des anderen
  let zuruf = { text: '', bis: 0 };       // dieselbe auf der Monitorseite
  let versuche = 0, gestartet = 0, laeuft = false;
  let raschelt = 0, raschelNah = false, letzterWandel = 0;
  let gezeigt = [];              // zuletzt geänderte Felder, für den Plan
  let gegner = [];               // { x, y, r, letzter, schritte }
  let schnitte = [];             // offene Schnitte, die wieder zuwachsen

  const sicht = document.getElementById('sicht');
  const plan = document.getElementById('plan');
  const s2 = sicht.getContext('2d');
  const p2 = plan.getContext('2d');
  const tafel = document.getElementById('tafel');
  const karte = document.getElementById('karte');

  if (ROLLE !== 'beide') {
    const seiten = document.querySelectorAll('.seite');
    seiten[ROLLE === 'laeufer' ? 1 : 0].style.display = 'none';
    seiten[ROLLE === 'laeufer' ? 0 : 1].style.flexBasis = '100%';
    document.querySelectorAll('.seite .schild')[ROLLE === 'laeufer' ? 0 : 1]
      .insertAdjacentHTML('beforeend',
        ROLLE === 'laeufer' ? ' &nbsp; der Weg kommt von oben'
                            : ' &nbsp; unten läuft jemand');
  }

  function groesse() {
    [sicht, plan].forEach((c) => {
      const r = c.getBoundingClientRect();
      const d = Math.min(window.devicePixelRatio || 1, 2);
      c.width = Math.max(1, Math.round(r.width * d));
      c.height = Math.max(1, Math.round(r.height * d));
    });
  }
  addEventListener('resize', groesse);

  // --------------------------------------------------------------
  // Die Sicht des Läufers. Gitterweise gezeichnet, nicht frei —
  // man steht immer mittig im Feld und schaut in eine der vier
  // Richtungen. Das passt zu "vor, zurück, links, rechts" und sieht
  // aus wie die alten Gangspiele.
  // --------------------------------------------------------------
  // Die Heckentextur. Liegt als Datei daneben; solange sie nicht geladen
  // ist, wird eine Blattmasse gewürfelt, damit nie eine leere Wand steht.
  const HECKE_DATEI = 'hecke.webp';
  const HECKE_HELL  = 0.58;     // die Textur ist kräftiger als die Stimmung
  const HECKE_DICKE = 0.16;     // Wandstärke als Anteil der Gangbreite
  // Eine Kachelgrösse für alle Heckenflächen, als Anteil der Bildhöhe.
  // Die Grösse nach Tiefe zu staffeln sieht nicht nach Perspektive aus,
  // sondern nach Bruchstellen: Zwischen zwei Tiefenabschnitten springt
  // sie, und man sieht grosse Blätter neben feinen. Fortlaufend ginge es
  // nur mit echter Texturprojektion, die Canvas nicht kann. Die Tiefe
  // macht jetzt allein die Abdunklung.
  const HECKE_KACHEL = 0.42;    // Kachelhöhe als Anteil der Bildhöhe
  // Nur ein Feld tief in den Seitengang. Tiefer hinein zu zeichnen ergibt
  // Geometrie, die es so nicht gibt: Von einem einzelnen Durchgang aus
  // sieht man nicht den ganzen Gang, und die erfundenen Flächen schneiden
  // als Keile in Boden und Hecke. Geht der Gang weiter, bleibt dort
  // Dunkelheit — bei zwei Feldern Sichtweite ist das ohnehin richtig.
  const GANG_TIEFE   = 1;       // so viele Felder tief in einen Seitengang

  const BODEN_DATEI = 'boden.webp';
  const BODEN_HELL  = 0.52;     // der Boden ist heller als die Stimmung
  const BODEN_KACHEL = 0.34;    // Kachelhöhe als Anteil der Bildhöhe

  let heckeBild = null, bodenBild = null;
  (function texturenLaden() {
    const a = new Image(); a.onload = () => { heckeBild = a; }; a.src = HECKE_DATEI;
    const b = new Image(); b.onload = () => { bodenBild = b; }; b.src = BODEN_DATEI;
  })();

  // Ein Stück Boden mit Textur. Dieselbe Technik wie bei den Hecken:
  // gekachelt statt gestreckt, Kachelgrösse nach Tiefe.
  function bodenFlaeche(punkte, dunkel, kachelHoehe) {
    if (!bodenBild || !bodenBild.complete || !bodenBild.naturalWidth) return false;
    const xs = punkte.map((p) => p[0]), ys = punkte.map((p) => p[1]);
    const x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs);
    const y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);
    if (x1 - x0 < 1 || y1 - y0 < 1) return true;
    const kh = Math.max(10, kachelHoehe);
    const kb = Math.max(10, kh * bodenBild.naturalWidth / bodenBild.naturalHeight);
    s2.save();
    s2.beginPath();
    punkte.forEach(([x, y], i) => (i ? s2.lineTo(x, y) : s2.moveTo(x, y)));
    s2.closePath();
    s2.clip();
    const sx0 = Math.floor(x0 / kb) * kb, sy0 = Math.floor(y0 / kh) * kh;
    for (let yy = sy0; yy < y1; yy += kh) {
      for (let xx = sx0; xx < x1; xx += kb) s2.drawImage(bodenBild, xx, yy, kb, kh);
    }
    s2.fillStyle = 'rgba(0,0,0,' + Math.max(0, 1 - dunkel * BODEN_HELL).toFixed(3) + ')';
    s2.fillRect(x0, y0, x1 - x0, y1 - y0);
    s2.restore();
    return true;
  }

  let heckeErsatz = null;
  function heckeWuerfeln() {
    const c = document.createElement('canvas');
    c.width = 384; c.height = 256;
    const g = c.getContext('2d');
    g.fillStyle = '#1b2d18'; g.fillRect(0, 0, 384, 256);
    const w = zufallAus(9876);
    for (let i = 0; i < 1400; i++) {
      const x = w() * 384, y = w() * 256, r = 3 + w() * 6, t = w();
      g.fillStyle = 'rgb(' + (18 + Math.round(t * 26)) + ',' +
                    (34 + Math.round(t * 46)) + ',' + (14 + Math.round(t * 20)) + ')';
      g.beginPath();
      g.ellipse(x, y, r, r * (0.6 + w() * 0.5), w() * Math.PI, 0, Math.PI * 2);
      g.fill();
    }
    return c;
  }

  // Alle Flächen eines Tiefenabschnitts bekommen dieselbe Kachelgrösse.
  // Unterschiedliche Grössen nebeneinander sehen aus wie Bruchstellen.
  //
  // Eine Heckenfläche: Textur gekachelt hinein, nach Tiefe abdunkeln, und
  // die Oberkante mit ein paar Büscheln aufbrechen. Gekachelt statt
  // gestreckt, damit die Blätter nicht verzerren — die Kachelgrösse hängt
  // an der Tiefe, dadurch werden sie nach hinten von selbst kleiner.
  function heckenFlaeche(punkte, dunkel, kante, saatFeld, kachelHoehe) {
    const bild = heckeBild && heckeBild.complete && heckeBild.naturalWidth
      ? heckeBild
      : (heckeErsatz || (heckeErsatz = heckeWuerfeln()));
    const xs = punkte.map((p) => p[0]), ys = punkte.map((p) => p[1]);
    const x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs);
    const y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);
    if (x1 - x0 < 1 || y1 - y0 < 1) return;

    const bb = bild.naturalWidth || bild.width;
    const bh = bild.naturalHeight || bild.height;
    const kh = Math.max(10, kachelHoehe);
    const kb = Math.max(10, kh * bb / bh);

    s2.save();
    s2.beginPath();
    punkte.forEach(([x, y], i) => (i ? s2.lineTo(x, y) : s2.moveTo(x, y)));
    s2.closePath();
    s2.clip();
    // Das Kachelraster am Bildschirm ausrichten, nicht an der Ecke dieser
    // Fläche. Sonst fängt jede Fläche bei einem anderen Blatt an und es
    // entstehen Nähte zwischen Flächen, die eine Hecke sein sollen.
    const sx0 = Math.floor(x0 / kb) * kb, sy0 = Math.floor(y0 / kh) * kh;
    for (let yy = sy0; yy < y1; yy += kh) {
      for (let xx = sx0; xx < x1; xx += kb) s2.drawImage(bild, xx, yy, kb, kh);
    }
    s2.fillStyle = 'rgba(0,0,0,' + Math.max(0, 1 - dunkel * HECKE_HELL).toFixed(3) + ')';
    s2.fillRect(x0, y0, x1 - x0, y1 - y0);
    s2.restore();

    if (!kante) return;
    const w = zufallAus(saatFeld);
    const [kx0, ky0, kx1, ky1] = kante;
    const dicke = Math.max(2, (Math.abs(kx1 - kx0) + Math.abs(ky1 - ky0)) * 0.05);
    const f = dunkel * HECKE_HELL;
    s2.fillStyle = 'rgb(' + Math.round(43 * f) + ',' + Math.round(79 * f) + ',' +
                   Math.round(28 * f) + ')';
    for (let i = 0; i < 9; i++) {
      const anteil = (i + 0.5) / 9 + (w() - 0.5) * 0.08;
      const px = kx0 + (kx1 - kx0) * anteil, py = ky0 + (ky1 - ky0) * anteil;
      const r = dicke * (0.8 + w() * 1.4);
      s2.beginPath();
      s2.ellipse(px, py + r * 0.25, r, r * 0.75, 0, 0, Math.PI * 2);
      s2.fill();
    }
  }

  function rahmen(tiefe, B, H) {
    const k = Math.pow(0.56, tiefe);
    return { l: B / 2 - B * 0.5 * k, r: B / 2 + B * 0.5 * k,
             o: H / 2 - H * 0.5 * k, u: H / 2 + H * 0.5 * k };
  }

  // Wie weit sieht man? Vom eigenen Feld nach vorne gehen, bis eine Hecke
  // im Weg steht. Das Feld mit der Hecke ist noch zu sehen, alles dahinter
  // nicht mehr. Ohne diese Rechnung schaut man durch Wände hindurch.
  function sichtTiefe(lab, x0, y0, r) {
    let t = 0;
    while (t < SICHT) {
      const x = x0 + DX[r] * t, y = y0 + DY[r] * t;
      if (x < 0 || y < 0 || x >= FELDER || y >= FELDER) break;
      if (wandDa(lab, x, y, r)) break;      // Hecke am vorderen Rand
      const nx = x + DX[r], ny = y + DY[r];
      if (nx < 0 || ny < 0 || nx >= FELDER || ny >= FELDER) break;
      t++;
    }
    return t;
  }

  // Die Spur einer Falle. Kein Warnzeichen — eine Stelle, an der der Boden
  // anders aussieht als daneben. Man sieht sie nur, wenn man direkt davor
  // steht und hinschaut.
  function spurMalen(a, b, dunkel, saatFeld) {
    const w = zufallAus(saatFeld);
    const mx = (a.l + a.r) / 2, oy = a.u, uy = b.u;
    const breite = (a.r - a.l) * 0.5;
    s2.save();
    s2.beginPath();
    s2.moveTo(mx - breite * 0.5, oy);
    s2.lineTo(mx + breite * 0.5, oy);
    s2.lineTo(mx + breite * 0.22, uy);
    s2.lineTo(mx - breite * 0.22, uy);
    s2.closePath();
    s2.clip();
    // etwas dunklere, leicht andere Erde
    s2.fillStyle = 'rgba(28,22,15,' + (0.5 * dunkel).toFixed(3) + ')';
    s2.fillRect(mx - breite, oy, breite * 2, uy - oy);
    // ein paar Halme und Krümel darüber
    s2.strokeStyle = 'rgba(58,48,32,' + (0.75 * dunkel).toFixed(3) + ')';
    s2.lineWidth = Math.max(1, breite * 0.02);
    for (let i = 0; i < 9; i++) {
      const px = mx + (w() - 0.5) * breite * 0.8;
      const py = oy + w() * (uy - oy);
      const l = breite * (0.05 + w() * 0.1);
      s2.beginPath();
      s2.moveTo(px, py);
      s2.lineTo(px + (w() - 0.5) * l, py + l * 0.4);
      s2.stroke();
    }
    s2.restore();
  }

  // Ein dunkler Umriss im Gang. Keine Figur im Detail — man soll ihn
  // erkennen und erschrecken, nicht anschauen.
  function gegnerMalen(a, b, dunkel) {
    const mx = (a.l + a.r) / 2;
    const hoehe = (a.u - a.o) * 0.62;
    const breite = (a.r - a.l) * 0.16;
    const fuss = (a.u + b.u) / 2;
    const d = Math.max(0.25, dunkel);
    s2.fillStyle = 'rgba(' + Math.round(18 * d) + ',' + Math.round(16 * d) + ',' +
                   Math.round(14 * d) + ',0.96)';
    s2.beginPath();
    s2.ellipse(mx, fuss - hoehe * 0.42, breite, hoehe * 0.42, 0, 0, Math.PI * 2);
    s2.fill();
    s2.beginPath();
    s2.arc(mx, fuss - hoehe * 0.88, breite * 0.52, 0, Math.PI * 2);
    s2.fill();
    // zwei helle Punkte, damit man weiss, dass er einen ansieht
    s2.fillStyle = 'rgba(232,112,90,' + (0.85 * d).toFixed(2) + ')';
    s2.beginPath();
    s2.arc(mx - breite * 0.22, fuss - hoehe * 0.9, breite * 0.09, 0, Math.PI * 2);
    s2.arc(mx + breite * 0.22, fuss - hoehe * 0.9, breite * 0.09, 0, Math.PI * 2);
    s2.fill();
  }

  function sichtMalen() {
    const B = sicht.width, H = sicht.height;
    s2.clearRect(0, 0, B, H);
    s2.fillStyle = '#0d1410'; s2.fillRect(0, 0, B, H / 2);
    s2.fillStyle = '#14100c'; s2.fillRect(0, H / 2, B, H / 2);

    const r = laeufer.r;
    const links = (r + 3) % 4, rechts = (r + 1) % 4;
    const tiefe = sichtTiefe(lab, laeufer.x, laeufer.y, r);

    // Von hinten nach vorne, damit Nahes das Ferne überdeckt
    for (let t = tiefe; t >= 0; t--) {
      const x = laeufer.x + DX[r] * t, y = laeufer.y + DY[r] * t;
      if (x < 0 || y < 0 || x >= FELDER || y >= FELDER) continue;
      // Man steht in der Mitte des Feldes, nicht an seinem hinteren Rand.
      // Deshalb liegt die Nahebene ein halbes Feld vor einem und die
      // Fernebene ein halbes dahinter. Für das eigene Feld wird die
      // Nahebene dadurch grösser als der Bildschirm — die Hecken neben
      // einem laufen aus dem Bild heraus, und so sieht es auch aus,
      // wenn man wirklich dazwischensteht.
      const a = rahmen(t - 0.5, B, H), b = rahmen(t + 0.5, B, H);
      const dunkel = Math.max(0.2, 1 - t * 0.17);
      const kachel = H * HECKE_KACHEL;

      const bodenFarbe = (hell) => 'rgba(' + Math.round(42 * hell) + ',' +
                    Math.round(34 * hell) + ',' + Math.round(24 * hell) + ',1)';

      // Seitliche Durchgänge. Ohne die sieht man an einer offenen Seite
      // nur den leeren Hintergrund, und das wirkt wie eine kaputte Wand
      // statt wie ein Weg.
      //
      // Der Gang wird mehrere Felder tief ausgebaut. Steht im Nachbarfeld
      // keine Hecke quer, sieht man weiter hinein — vorher klaffte dort
      // ein schwarzes Loch.
      [[links, -1], [rechts, 1]].forEach(([seite, vorzeichen]) => {
        if (wandDa(lab, x, y, seite)) return;

        const randVon = (p) => (vorzeichen < 0 ? p.l : p.r);
        const aussenVon = (p) => randVon(p) + vorzeichen * (p.r - p.l);

        // Erst ausrechnen, wie weit man in den Gang sieht, dann von hinten
        // nach vorne zeichnen. Andersherum malt der hintere Abschnitt über
        // den vorderen, und es entstehen Keile, die in den Boden schneiden.
        let gTiefe = 0;
        while (gTiefe < GANG_TIEFE - 1) {
          const cx = x + DX[seite] + DX[r] * gTiefe;
          const cy = y + DY[seite] + DY[r] * gTiefe;
          if (cx < 0 || cy < 0 || cx >= FELDER || cy >= FELDER) break;
          if (wandDa(lab, cx, cy, r)) break;
          const wx2 = cx + DX[r], wy2 = cy + DY[r];
          if (wx2 < 0 || wy2 < 0 || wx2 >= FELDER || wy2 >= FELDER) break;
          gTiefe++;
        }

        for (let k = gTiefe; k >= 0; k--) {
          const nah  = rahmen(t + k - 0.5, B, H);
          const fern = rahmen(t + k + 0.5, B, H);
          const gx = x + DX[seite] + DX[r] * k;
          const gy = y + DY[seite] + DY[r] * k;
          if (gx < 0 || gy < 0 || gx >= FELDER || gy >= FELDER) break;

          const kante  = randVon(nah),  kanteF = randVon(fern);
          const aussen = aussenVon(nah), aussenF = aussenVon(fern);
          const dk = Math.max(0.18, dunkel - k * 0.17);
          const ka = H * HECKE_KACHEL;

          // Boden des Gangabschnitts
          const gangPunkte = [[aussen, nah.u], [kante, nah.u],
                              [kanteF, fern.u], [aussenF, fern.u]];
          if (!bodenFlaeche(gangPunkte, dk, H * BODEN_KACHEL)) {
            s2.fillStyle = bodenFarbe(dk * 0.9);
            s2.beginPath();
            gangPunkte.forEach(([px, py], i) => (i ? s2.lineTo(px, py) : s2.moveTo(px, py)));
            s2.closePath(); s2.fill();
          }

          // Aussenhecke des Gangs
          if (wandDa(lab, gx, gy, seite)) {
            heckenFlaeche([[aussen, nah.o], [aussenF, fern.o],
                           [aussenF, fern.u], [aussen, nah.u]],
                          dk * 0.9, [aussen, nah.o, aussenF, fern.o],
                          gx * 97 + gy * 31 + 11, ka);
          }
          // Innenhecke zum Korridor hin, sobald man weiter hineinschaut
          if (k > 0 && wandDa(lab, gx, gy, (seite + 2) % 4)) {
            heckenFlaeche([[kante, nah.o], [kanteF, fern.o],
                           [kanteF, fern.u], [kante, nah.u]],
                          dk * 0.9, [kante, nah.o, kanteF, fern.o],
                          gx * 97 + gy * 31 + 31, ka);
          }
          // Hecke, die im Gang quer steht — sonst geht es dort weiter,
          // und man sieht in die Dunkelheit.
          if (wandDa(lab, gx, gy, r)) {
            heckenFlaeche([[kanteF, fern.o], [aussenF, fern.o],
                           [aussenF, fern.u], [kanteF, fern.u]],
                          dk * 0.84, [kanteF, fern.o, aussenF, fern.o],
                          gx * 97 + gy * 31 + 21, ka);
          } else {
            s2.fillStyle = 'rgba(6,10,7,0.92)';
            s2.beginPath();
            s2.moveTo(kanteF, fern.o); s2.lineTo(aussenF, fern.o);
            s2.lineTo(aussenF, fern.u); s2.lineTo(kanteF, fern.u);
            s2.closePath(); s2.fill();
          }

          // Die Stirnseiten der Hecken, die den Durchgang einrahmen
          if (k === 0) {
            const d0 = (nah.r - nah.l) * HECKE_DICKE;
            const d1 = (fern.r - fern.l) * HECKE_DICKE;
            if (wandDa(lab, x - DX[r], y - DY[r], seite)) {
              heckenFlaeche([[kante, nah.o], [kante + vorzeichen * d0, nah.o],
                             [kante + vorzeichen * d0, nah.u], [kante, nah.u]],
                            dk * 0.62, null, 0, ka);
            }
            if (wandDa(lab, gx + DX[r], gy + DY[r], seite)) {
              heckenFlaeche([[kanteF, fern.o], [kanteF + vorzeichen * d1, fern.o],
                             [kanteF + vorzeichen * d1, fern.u], [kanteF, fern.u]],
                            dk * 0.58, null, 0, ka);
            }
          }

        }
      });

      // Boden des Abschnitts
      const bodenPunkte = [[a.l, a.u], [a.r, a.u], [b.r, b.u], [b.l, b.u]];
      if (!bodenFlaeche(bodenPunkte, dunkel, H * BODEN_KACHEL)) {
        s2.fillStyle = bodenFarbe(dunkel * 0.9);
        s2.beginPath();
        bodenPunkte.forEach(([px, py], i) => (i ? s2.lineTo(px, py) : s2.moveTo(px, py)));
        s2.closePath(); s2.fill();
      }

      // Die Spur einer Falle — nur ein Feld weit und nur für den Läufer
      if (lab.falle[y][x] && t <= 1) spurMalen(a, b, dunkel, x * 97 + y * 31 + 7);

      // Der Gärtner, wenn er im Gang vor einem steht
      if (gegnerAufFeld(x, y)) gegnerMalen(a, b, dunkel);

      const saat = x * 97 + y * 31;
      if (wandDa(lab, x, y, links)) {
        heckenFlaeche([[a.l, a.o], [b.l, b.o], [b.l, b.u], [a.l, a.u]],
                      dunkel, [a.l, a.o, b.l, b.o], saat + 1, kachel);
      }
      if (wandDa(lab, x, y, rechts)) {
        heckenFlaeche([[a.r, a.o], [b.r, b.o], [b.r, b.u], [a.r, a.u]],
                      dunkel * 0.93, [a.r, a.o, b.r, b.o], saat + 2, kachel);
      }
      if (wandDa(lab, x, y, r)) {
        heckenFlaeche([[b.l, b.o], [b.r, b.o], [b.r, b.u], [b.l, b.u]],
                      dunkel * 0.86, [b.l, b.o, b.r, b.o], saat + 3, kachel);
      }
      // Ziel
      if (x === lab.ziel[0] && y === lab.ziel[1] && t > 0) {
        s2.fillStyle = 'rgba(240,193,115,' + (0.5 * dunkel).toFixed(3) + ')';
        s2.fillRect(b.l, b.o, b.r - b.l, b.u - b.o);
      }
    }

    // Schritte in der Nähe
    const gd = gegnerAbstand();
    if (laeuft && gd <= GEGNER_HOERT) {
      const gr = Math.max(13, H * 0.04);
      s2.font = '600 ' + gr + 'px -apple-system, sans-serif';
      s2.textAlign = 'center';
      s2.fillStyle = 'rgba(232,112,90,0.9)';
      s2.fillText(gd <= 1 ? 'Schritte, ganz nah' : 'Irgendwo Schritte', B / 2, H * 0.86);
    }

    // Es hat sich etwas bewegt
    if (Date.now() < raschelt) {
      const gr = Math.max(12, H * 0.035);
      s2.font = gr + 'px -apple-system, sans-serif';
      s2.textAlign = 'center';
      s2.fillStyle = 'rgba(143,212,154,0.85)';
      s2.fillText(raschelNah ? 'Direkt neben dir bewegt sich etwas'
                             : 'Ganz in der Nähe raschelt es', B / 2, H * 0.93);
    }

    // Durchsage vom Monitor
    if (Date.now() < durchsage.bis && durchsage.text) {
      const gr = Math.max(13, H * 0.045);
      s2.font = '600 ' + gr + 'px -apple-system, sans-serif';
      s2.textAlign = 'center';
      const br = Math.min(s2.measureText(durchsage.text).width + gr, B * 0.9);
      s2.fillStyle = 'rgba(10,9,8,0.86)';
      s2.beginPath();
      if (s2.roundRect) s2.roundRect(B / 2 - br / 2, H * 0.06, br, gr * 1.9, 8);
      else s2.rect(B / 2 - br / 2, H * 0.06, br, gr * 1.9);
      s2.fill();
      s2.fillStyle = '#f0c173';
      s2.fillText(durchsage.text, B / 2, H * 0.06 + gr * 1.3, B * 0.86);
    }
  }

  // --------------------------------------------------------------
  // Der Monitor. Wände und Läufer, aber keine Fallen.
  // --------------------------------------------------------------
  function planMalen() {
    const B = plan.width, H = plan.height;
    p2.clearRect(0, 0, B, H);
    p2.fillStyle = '#0b1410'; p2.fillRect(0, 0, B, H);
    const rand = Math.min(B, H) * 0.06;
    const feld = Math.min((B - rand * 2) / FELDER, (H - rand * 2) / FELDER);
    const ox = (B - feld * FELDER) / 2, oy = (H - feld * FELDER) / 2;

    // Ziel
    p2.fillStyle = 'rgba(240,193,115,0.18)';
    p2.fillRect(ox + lab.ziel[0] * feld, oy + lab.ziel[1] * feld, feld, feld);

    // Was sich gerade geändert hat, blinkt kurz auf
    gezeigt = gezeigt.filter((g) => g.bis > Date.now());
    gezeigt.forEach((g) => {
      const rest = (g.bis - Date.now()) / WANDEL_ZEIGT;
      p2.fillStyle = 'rgba(240,193,115,' + (0.35 * rest).toFixed(3) + ')';
      p2.fillRect(ox + g.x * feld, oy + g.y * feld, feld, feld);
    });

    // Markierungen des Führenden
    marken.forEach(([mx, my]) => {
      p2.strokeStyle = '#e88a8a';
      p2.lineWidth = Math.max(2, feld * 0.08);
      const x = ox + mx * feld, y = oy + my * feld;
      p2.beginPath();
      p2.moveTo(x + feld * 0.25, y + feld * 0.25);
      p2.lineTo(x + feld * 0.75, y + feld * 0.75);
      p2.moveTo(x + feld * 0.75, y + feld * 0.25);
      p2.lineTo(x + feld * 0.25, y + feld * 0.75);
      p2.stroke();
    });

    // Wände
    p2.strokeStyle = '#4a7a46';
    p2.lineWidth = Math.max(1.5, feld * 0.09);
    p2.lineCap = 'round';
    for (let y = 0; y < FELDER; y++) {
      for (let x = 0; x < FELDER; x++) {
        const l = ox + x * feld, o = oy + y * feld;
        const w = lab.wand[y][x];
        p2.beginPath();
        if (w[0]) { p2.moveTo(l, o); p2.lineTo(l + feld, o); }
        if (w[1]) { p2.moveTo(l + feld, o); p2.lineTo(l + feld, o + feld); }
        if (w[2]) { p2.moveTo(l, o + feld); p2.lineTo(l + feld, o + feld); }
        if (w[3]) { p2.moveTo(l, o); p2.lineTo(l, o + feld); }
        p2.stroke();
      }
    }

    // Der Läufer: der Kopf seiner Figur, dazu die Blickrichtung
    const lx = ox + (laeufer.x + 0.5) * feld, ly = oy + (laeufer.y + 0.5) * feld;
    const halb = feld * 0.40;

    // Blickrichtung als Keil hinter dem Kopf, damit der Kopf frei bleibt
    p2.fillStyle = 'rgba(240,193,115,0.9)';
    p2.save();
    p2.translate(lx, ly);
    p2.rotate(laeufer.r * Math.PI / 2);          // 0 ist Norden
    p2.beginPath();
    p2.moveTo(0, -halb * 1.55);
    p2.lineTo(-halb * 0.5, -halb * 0.85);
    p2.lineTo(halb * 0.5, -halb * 0.85);
    p2.closePath(); p2.fill();
    p2.restore();

    if (kopfBild && kopfBild.complete && kopfBild.naturalWidth) {
      const [kx, ky, kb, kh] = FIGUREN[KOPF_FIGUR].kopf;
      const B0 = kopfBild.naturalWidth, H0 = kopfBild.naturalHeight;
      p2.save();
      p2.beginPath(); p2.arc(lx, ly, halb, 0, Math.PI * 2); p2.clip();
      p2.fillStyle = '#131210';
      p2.fillRect(lx - halb, ly - halb, halb * 2, halb * 2);
      p2.translate(lx, ly);
      // Die Bilder schauen nach links; nach Osten wird gespiegelt
      if (laeufer.r === 1) p2.scale(-1, 1);
      p2.drawImage(kopfBild, kx * B0, ky * H0, kb * B0, kh * H0,
                   -halb, -halb, halb * 2, halb * 2);
      p2.restore();
      p2.strokeStyle = '#f0c173';
      p2.lineWidth = Math.max(1.5, feld * 0.05);
      p2.beginPath(); p2.arc(lx, ly, halb, 0, Math.PI * 2); p2.stroke();
    } else {
      p2.fillStyle = '#f0c173';
      p2.beginPath(); p2.arc(lx, ly, feld * 0.22, 0, Math.PI * 2); p2.fill();
    }

    // Zuruf des Läufers
    if (Date.now() < zuruf.bis && zuruf.text) {
      const gr = Math.max(13, H * 0.042);
      p2.font = '600 ' + gr + 'px -apple-system, sans-serif';
      p2.textAlign = 'center';
      const br = Math.min(p2.measureText(zuruf.text).width + gr, B * 0.9);
      p2.fillStyle = 'rgba(10,9,8,0.88)';
      p2.beginPath();
      if (p2.roundRect) p2.roundRect(B / 2 - br / 2, H * 0.03, br, gr * 1.9, 8);
      else p2.rect(B / 2 - br / 2, H * 0.03, br, gr * 1.9);
      p2.fill();
      p2.fillStyle = '#8fd49a';
      p2.fillText(zuruf.text, B / 2, H * 0.03 + gr * 1.3, B * 0.86);
    }

    // Der Gärtner — nur der Führende sieht ihn auf dem Plan
    gegner.forEach((g) => {
      const gx = ox + (g.x + 0.5) * feld, gy = oy + (g.y + 0.5) * feld;
      p2.fillStyle = '#e8705a';
      p2.beginPath(); p2.arc(gx, gy, feld * 0.26, 0, Math.PI * 2); p2.fill();
      p2.strokeStyle = 'rgba(232,112,90,0.5)';
      p2.lineWidth = Math.max(1, feld * 0.06);
      p2.beginPath(); p2.arc(gx, gy, feld * 0.45, 0, Math.PI * 2); p2.stroke();
    });

    if (!FUEHREND && !weltBekommen) {
      p2.fillStyle = 'rgba(10,9,8,0.82)';
      p2.fillRect(0, 0, B, H);
      const gr = Math.max(14, H * 0.045);
      p2.font = gr + 'px -apple-system, sans-serif';
      p2.textAlign = 'center';
      p2.fillStyle = '#8a857a';
      p2.fillText('Noch niemand unten im Labyrinth', B / 2, H / 2);
    }

    plan._feld = { feld, ox, oy };
  }

  // --------------------------------------------------------------
  // Bewegen
  // --------------------------------------------------------------
  // ------------------------------------------------------------------
  // Der Gärtner
  // ------------------------------------------------------------------
  function gegnerSetzen() {
    gegner = [];
    for (let i = 0; i < GEGNER_ZAHL; i++) {
      // weit weg vom Eingang starten, sonst steht er gleich vor der Nase
      let x = 0, y = 0, wache = 0;
      do {
        x = Math.floor(Math.random() * FELDER);
        y = Math.floor(Math.random() * FELDER);
      } while (wache++ < 300 && (x + y < FELDER || lab.falle[y][x]));
      gegner.push({ x: x, y: y, r: Math.floor(Math.random() * 4), letzter: 0 });
    }
  }

  function gegnerSchritt() {
    const jetzt = Date.now();
    gegner.forEach((g) => {
      if (jetzt - g.letzter < GEGNER_TAKT) return;
      g.letzter = jetzt;
      g.schritte = (g.schritte || 0) + 1;

      // Bei jedem vierten Schritt schneidet er sich durch eine Hecke und
      // bleibt dabei stehen. Solange er schneidet, ist er berechenbar —
      // und der Schnitt entsteht dort, wo der Führende ihn gerade sieht.
      if (g.schritte % SCHNITT_JEDER === 0) {
        const zu = [];
        for (let r = 0; r < 4; r++) {
          const nx = g.x + DX[r], ny = g.y + DY[r];
          if (nx < 0 || ny < 0 || nx >= FELDER || ny >= FELDER) continue;
          if (lab.wand[g.y][g.x][r]) zu.push(r);
        }
        if (zu.length) {
          const r = zu[Math.floor(Math.random() * zu.length)];
          if (heckeSetzen(lab, g.x, g.y, r, false, laeufer.x, laeufer.y)) {
            schnitte.push({ x: g.x, y: g.y, r: r, bis: jetzt + SCHNITT_OFFEN });
            gezeigt.push({ x: g.x, y: g.y, bis: jetzt + WANDEL_ZEIGT });
            gezeigt.push({ x: g.x + DX[r], y: g.y + DY[r], bis: jetzt + WANDEL_ZEIGT });
            raschelt = jetzt + 3000;
            raschelNah = Math.abs(g.x - laeufer.x) + Math.abs(g.y - laeufer.y) <= 2;
            return;                      // dieser Schritt war das Schneiden
          }
        }
      }
      // offene Richtungen, am liebsten nicht zurück
      const offen = [];
      for (let r = 0; r < 4; r++) {
        if (wandDa(lab, g.x, g.y, r)) continue;
        const nx = g.x + DX[r], ny = g.y + DY[r];
        if (nx < 0 || ny < 0 || nx >= FELDER || ny >= FELDER) continue;
        if (nx === 0 && ny === 0) continue;         // der Eingang bleibt frei
        offen.push(r);
      }
      if (!offen.length) return;
      const zurueck = (g.r + 2) % 4;
      const lieber = offen.filter((r) => r !== zurueck);
      const wahl = (lieber.length ? lieber : offen)[
        Math.floor(Math.random() * (lieber.length ? lieber.length : offen.length))];
      g.r = wahl;
      g.x += DX[wahl];
      g.y += DY[wahl];
    });
  }

  function gegnerAufFeld(x, y) {
    return gegner.some((g) => g.x === x && g.y === y);
  }

  function gegnerAbstand() {
    let d = 99;
    gegner.forEach((g) => {
      d = Math.min(d, Math.abs(g.x - laeufer.x) + Math.abs(g.y - laeufer.y));
    });
    return d;
  }

  function erwischt() {
    versuche++;
    laeufer = { x: 0, y: 0, r: 1 };
    eintragen('ereignis', 'Der Gärtner hat dich — zurück zum Eingang');
    standMalen();
  }

  function gehen(vor) {
    if (!laeuft || gleit.art) return;
    const r = vor ? laeufer.r : (laeufer.r + 2) % 4;
    if (wandDa(lab, laeufer.x, laeufer.y, r)) return;   // Hecke im Weg
    const nx = laeufer.x + DX[r], ny = laeufer.y + DY[r];
    laeufer.x = nx; laeufer.y = ny;

    if (gegnerAufFeld(nx, ny)) { erwischt(); return; }
    if (lab.falle[ny][nx]) {
      versuche++;
      laeufer = { x: 0, y: 0, r: 1 };
      eintragen('ereignis', 'Reingetappt — zurück zum Eingang');
      standMalen();
      return;
    }
    if (nx === lab.ziel[0] && ny === lab.ziel[1]) { geschafft(); return; }
    standMalen();
  }

  function drehen(nachRechts) {
    if (!laeuft || gleit.art) return;
    laeufer.r = (laeufer.r + (nachRechts ? 1 : 3)) % 4;
  }

  function standMalen() {
    document.getElementById('kopf-stand').textContent =
      'Feld ' + (laeufer.x + 1) + ' / ' + (laeufer.y + 1);
    document.getElementById('kopf-hinweis').textContent =
      versuche ? versuche + ' mal reingetappt' : '';
  }

  // --------------------------------------------------------------
  // Tafeln
  // --------------------------------------------------------------
  function tafelZeigen(html, knoepfe) {
    karte.innerHTML = html;
    const leiste = document.createElement('div');
    knoepfe.forEach(([t, tun]) => {
      const b = document.createElement('button');
      b.textContent = t; b.onclick = tun; leiste.appendChild(b);
    });
    karte.appendChild(leiste);
    tafel.classList.remove('weg');
  }

  function verlaufMalen() {
    ['laeufer', 'monitor'].forEach((seite) => {
      const el = document.getElementById('verlauf-' + seite);
      if (!el) return;
      el.innerHTML = verlauf.map((z) =>
        '<div class="' + z.wer + '">' +
        (z.wer === 'ereignis' ? '' : '<b>' + text(z.name) + '</b>') +
        text(z.text) + '</div>').join('');
      el.scrollTop = el.scrollHeight;
    });
  }

  function text(s) {
    return String(s).replace(/[&<>"]/g, (z) =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[z]);
  }

  function eintragen(wer, t, name) {
    verlauf.push({ wer: wer, text: t,
                   name: wer === 'ich' ? 'Du' : (name || 'Der andere') });
    if (verlauf.length > VERLAUF_LAENGE) verlauf.shift();
    verlaufMalen();
    if (wer === 'er') {
      durchsage = { text: t, bis: Date.now() + 6000 };
      zuruf = { text: t, bis: Date.now() + 6000 };
    }
  }

  // Die Seite hat ihre eigene Verbindung. Den Kanalnamen gibt das Haus
  // in der Adresse mit — er hängt an den Kennungen der beiden Spieler,
  // deshalb sieht den Chat nur, wer gerade zusammen spielt. Ohne
  // Kanalnamen, also auf der Testseite, kommt alles bei einem selbst
  // zurück.
  const NETZ_URL = 'https://uvnffzypgtrzgqtthdrn.supabase.co';
  const NETZ_SCHLUESSEL = 'sb_publishable_3q0OPU3U_DgYMcqSbacRqg_OVv7FofY';
  const KANAL_NAME = adresse.get('kanal') || '';
  const ICH = adresse.get('ich') || ('x' + Math.random().toString(36).slice(2, 8));

  // Wer führt die Welt? Der Läufer. Der Turm sieht nur zu und bekommt
  // Hecken, Gärtner und Standort geschickt — Fallen ausdrücklich nicht.
  const FUEHREND = ROLLE !== 'monitor';
  const WELT_TAKT = 350;        // Millisekunden zwischen zwei Weltpaketen
  let letzteWelt = 0;
  let weltBekommen = false;

  let kanal = null;
  (function verbinden() {
    if (!KANAL_NAME || typeof supabase === 'undefined') return;
    try {
      const klient = supabase.createClient(NETZ_URL, NETZ_SCHLUESSEL);
      kanal = klient.channel(KANAL_NAME);
      kanal.on('broadcast', { event: 'welt' }, ({ payload }) => {
        if (FUEHREND || !payload) return;
        weltUebernehmen(payload);
      });
      kanal.on('broadcast', { event: 'sagt' }, ({ payload }) => {
        if (!payload || payload.von === ICH) return;
        // Der Name kommt mit der Nachricht, nicht aus der Adresse —
        // so stimmt er auch für Figuren, die diese Seite nicht kennt.
        eintragen('er', String(payload.text).slice(0, 120),
                  payload.name ? String(payload.name).slice(0, 20) : null);
      });
      kanal.subscribe();
    } catch (e) { kanal = null; }
  })();

  // Die Hecken als Zeichenkette: vier Bit je Feld, ein Zeichen je Feld.
  function wandCode() {
    let s = '';
    for (let y = 0; y < FELDER; y++) {
      for (let x = 0; x < FELDER; x++) {
        const w = lab.wand[y][x];
        s += ((w[0] ? 1 : 0) | (w[1] ? 2 : 0) | (w[2] ? 4 : 0) | (w[3] ? 8 : 0))
             .toString(16);
      }
    }
    return s;
  }

  function wandLesen(s) {
    if (!s || s.length < FELDER * FELDER) return;
    let i = 0;
    for (let y = 0; y < FELDER; y++) {
      for (let x = 0; x < FELDER; x++) {
        const v = parseInt(s[i++], 16);
        lab.wand[y][x] = [!!(v & 1), !!(v & 2), !!(v & 4), !!(v & 8)];
      }
    }
  }

  function weltSenden() {
    if (!kanal || !FUEHREND || !laeuft) return;
    const jetzt = Date.now();
    if (jetzt - letzteWelt < WELT_TAKT) return;
    letzteWelt = jetzt;
    try {
      kanal.send({ type: 'broadcast', event: 'welt', payload: {
        wand: wandCode(),
        laeufer: { x: laeufer.x, y: laeufer.y, r: laeufer.r },
        gegner: gegner.map((g) => ({ x: g.x, y: g.y })),
        gezeigt: gezeigt.map((z) => ({ x: z.x, y: z.y, bis: z.bis }))
      } });
    } catch (e) {}
  }

  function weltUebernehmen(p) {
    wandLesen(p.wand);
    if (p.laeufer) laeufer = { x: p.laeufer.x, y: p.laeufer.y, r: p.laeufer.r };
    gegner = (p.gegner || []).map((g) => ({ x: g.x, y: g.y, r: 0, letzter: 0 }));
    gezeigt = p.gezeigt || [];
    weltBekommen = true;
  }

  function schicken(t) {
    if (!t) return;
    eintragen('ich', t);
    if (!kanal) { return; }
    try {
      kanal.send({ type: 'broadcast', event: 'sagt',
                   payload: { von: ICH, text: t,
                              name: (FIGUREN[WER] && FIGUREN[WER].name) || WER } });
    } catch (e) {}
  }

  function anfangsTafel() {
    tafelZeigen(
      '<h1>Das Heckenlabyrinth</h1>' +
      '<table>' +
      (ROLLE === 'monitor'
        ? '<tr><td>Du siehst zu</td><td>Feld anklicken markiert, nochmal klicken l\u00f6scht</td></tr>'
        : '<tr><td>Du l\u00e4ufst</td><td>W vor, S zur\u00fcck, A und D drehen</td></tr>') +
      '</table>',
      ROLLE === 'monitor'
        ? [['Zusehen', function () { losgehen(Date.now() & 0xffff); }]]
        : [['Anfangen', function () { losgehen(Date.now() & 0xffff); }]]
    );
  }

  function geschafft() {
    laeuft = false;
    const dauer = Math.round((Date.now() - gestartet) / 1000);
    tafelZeigen(
      '<h1>Durch</h1>' +
      '<p>Ihr habt ' + Math.floor(dauer / 60) + ':' +
      String(dauer % 60).padStart(2, '0') + ' gebraucht und seid ' + versuche +
      ' mal in eine Falle getappt.</p>' +
      '<p>Das Labyrinth wird jedes Mal neu gewürfelt — auswendig lernen geht nicht.</p>',
      [['Nochmal', function () { losgehen(Date.now() & 0xffff); }]]
    );
  }

  function losgehen(neueSaat) {
    saat = neueSaat;
    lab = labyrinthBauen(saat);
    laeufer = { x: 0, y: 0, r: 1 };
    marken = [];
    versuche = 0;
    durchsage = { text: '', bis: 0 };
    zuruf = { text: '', bis: 0 };
    verlauf = [];
    verlaufMalen();
    if (FUEHREND) gegnerSetzen();
    else {
      gegner = [];
      for (let y = 0; y < FELDER; y++) lab.falle[y] = new Array(FELDER).fill(false);
      weltBekommen = false;
    }
    gezeigt = [];
    schnitte = [];
    letzterWandel = Date.now();
    gestartet = Date.now();
    raschelt = 0;
    laeuft = true;
    tafel.classList.add('weg');
    groesse();
    standMalen();
  }

  // --------------------------------------------------------------
  // Eingaben
  // --------------------------------------------------------------
  addEventListener('keydown', (e) => {
    const wo = document.activeElement;
    if (wo && wo.tagName === 'INPUT') return;    // beim Tippen nicht laufen
    // Wer am Monitor sitzt, läuft nicht. Er sieht zu und sagt an.
    if (ROLLE === 'monitor') return;
    const t = e.key.toLowerCase();
    if (t === 'w' || t === 'arrowup')    { gehen(true);  e.preventDefault(); }
    if (t === 's' || t === 'arrowdown')  { gehen(false); e.preventDefault(); }
    if (t === 'a' || t === 'arrowleft')  { drehen(false); e.preventDefault(); }
    if (t === 'd' || t === 'arrowright') { drehen(true);  e.preventDefault(); }
  });

  plan.addEventListener('contextmenu', (e) => e.preventDefault());
  plan.addEventListener('pointerdown', (e) => {
    if (!laeuft || !plan._feld) return;
    if (ROLLE === 'laeufer') return;             // der Läufer markiert nicht
    const r = plan.getBoundingClientRect();
    const d = plan.width / r.width;
    const { feld, ox, oy } = plan._feld;
    const x = Math.floor(((e.clientX - r.left) * d - ox) / feld);
    const y = Math.floor(((e.clientY - r.top) * d - oy) / feld);
    if (x < 0 || y < 0 || x >= FELDER || y >= FELDER) return;

    const i = marken.findIndex((m) => m[0] === x && m[1] === y);
    if (i >= 0) marken.splice(i, 1); else marken.push([x, y]);
  });

  function durchsagen() {
    const feld = document.getElementById('durchsage');
    const t = feld.value.trim();
    if (!t) return;
    schicken(t.slice(0, 80));
    feld.value = '';
  }
  document.getElementById('senden').onclick = durchsagen;
  document.getElementById('durchsage').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { durchsagen(); e.preventDefault(); }
  });

  function rufen() {
    const feld = document.getElementById('ruf');
    const t = feld.value.trim();
    if (!t) return;
    schicken(t.slice(0, 80));
    feld.value = '';
  }
  document.getElementById('rufen').onclick = rufen;
  document.getElementById('ruf').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { rufen(); e.preventDefault(); }
  });

  function schleife() {
    requestAnimationFrame(schleife);
    if (!lab) return;

    if (laeuft && FUEHREND) {
      gegnerSchritt();
      // Schnitte wachsen wieder zu, sonst wird das Labyrinth mit der Zeit
      // zu einem offenen Feld. Geht das Zuwachsen gerade nicht, weil
      // jemand eingesperrt würde, bleibt der Schnitt eben länger offen.
      schnitte = schnitte.filter((s) => {
        if (s.bis > Date.now()) return true;
        if (gegnerAufFeld(s.x, s.y)) return true;
        if (!heckeSetzen(lab, s.x, s.y, s.r, true, laeufer.x, laeufer.y)) return true;
        gezeigt.push({ x: s.x, y: s.y, bis: Date.now() + WANDEL_ZEIGT });
        return false;
      });
      if (gegnerAufFeld(laeufer.x, laeufer.y)) erwischt();

      // Eine einzelne Hecke verschiebt sich von selbst
      if (WANDEL_TAKT && Date.now() - letzterWandel > WANDEL_TAKT) {
        letzterWandel = Date.now();
        const schliessen = Math.random() < 0.5;
        for (let versuch = 0; versuch < 400; versuch++) {
          const wx = laeufer.x + Math.round((Math.random() - 0.5) * 2 * WANDEL_NAEHE);
          const wy = laeufer.y + Math.round((Math.random() - 0.5) * 2 * WANDEL_NAEHE);
          if (wx < 0 || wy < 0 || wx >= FELDER || wy >= FELDER) continue;
          const wr = Math.floor(Math.random() * 4);
          if (!heckeSetzen(lab, wx, wy, wr, schliessen, laeufer.x, laeufer.y)) continue;
          gezeigt.push({ x: wx, y: wy, bis: Date.now() + WANDEL_ZEIGT });
          gezeigt.push({ x: wx + DX[wr], y: wy + DY[wr], bis: Date.now() + WANDEL_ZEIGT });
          raschelt = Date.now() + 3000;
          raschelNah = Math.abs(wx - laeufer.x) + Math.abs(wy - laeufer.y) <= 2;
          break;
        }
      }
    }

    weltSenden();
    sichtMalen();
    planMalen();
  }

  lab = labyrinthBauen(1);
  groesse();
  anfangsTafel();
  schleife();
})();
</script>
</body>
</html>
