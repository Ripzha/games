<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vaas' Schrottschlitten — zu zweit</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #060d1c; color: #e8e4da;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    overflow: hidden; }
  #huelle { position: relative; height: 100%; display: flex; flex-direction: column; }
  .haelfte { position: relative; flex: 1 1 50%; min-height: 0; border: 0; width: 100%; }
  .haelfte iframe { width: 100%; height: 100%; border: 0; display: block; }
  #trenner { height: 2px; background: #3a4a6a; flex: none; }
  .schild { position: absolute; left: 10px; bottom: 8px; z-index: 3;
    display: flex; align-items: baseline; gap: 8px;
    font-size: 12px; color: #9fb4d8; background: rgba(6,13,28,0.72);
    padding: 4px 11px; border-radius: 12px; pointer-events: none; }
  .schild .name { font-size: 15px; font-weight: 600; color: #f0c173;
    letter-spacing: 0; text-transform: none; }
  .schild .tasten { letter-spacing: .06em; text-transform: uppercase; }
  #tafel { position: absolute; inset: 0; z-index: 9; display: flex;
    align-items: center; justify-content: center; padding: 24px;
    background: rgba(6,13,28,0.93); }
  #tafel.weg { display: none; }
  #karte { max-width: 460px; width: 100%; background: rgba(10,18,34,0.98);
    border: 1px solid #3a4a6a; border-radius: 12px; padding: 22px 24px; }
  #karte h1 { margin: 0 0 10px; font-size: 20px; font-weight: 500; color: #f0c173; }
  #karte p { margin: 0 0 12px; font-size: 15px; line-height: 1.55; color: #cdd8ea; }
  #karte table { width: 100%; border-collapse: collapse; margin: 0 0 14px; font-size: 14px; }
  #karte td { padding: 5px 0; color: #cdd8ea; }
  #karte td:last-child { text-align: right; color: #9fb4d8; }
  #karte button { padding: 9px 18px; margin: 4px 6px 0 0; background: #1d2a44;
    color: #f0c173; border: 1px solid #3a4a6a; border-radius: 6px;
    font-size: 15px; cursor: pointer; }
</style>
</head>
<body>
<div id="huelle">
  <div class="haelfte"><div class="schild"><span class="name" id="name-oben"></span><span class="tasten">Leertaste springen, S ducken</span></div>
    <iframe id="oben" src="quest-schlitten.html?sync=meister&abstand=1.5"></iframe></div>
  <div id="trenner"></div>
  <div class="haelfte"><div class="schild"><span class="name" id="name-unten"></span><span class="tasten" id="tasten-unten"></span></div>
    <iframe id="unten" src="quest-schlitten.html?sync=spiegel&abstand=1.5"></iframe></div>

  <div id="tafel"><div id="karte"></div></div>
</div>

<script>
(function () {
  'use strict';

  // Gemeinsamer Vorrat für beide. Jeder Treffer von jedem kostet eines.
  const HERZEN = 5;

  // Namen kommen aus der Adresse: zwei.html?oben=Name&unten=Name
  // Aus dem Automaten im Haus heraus wird der Name der gespielten Figur
  // mitgegeben. Ohne Angabe steht da Spieler 1 und Spieler 2.
  const adresse = new URLSearchParams(location.search);
  const NAME_OBEN  = (adresse.get('oben')  || 'Spieler 1').slice(0, 20);
  const NAME_UNTEN = (adresse.get('unten') || 'Spieler 2').slice(0, 20);

  const oben  = document.getElementById('oben');
  const unten = document.getElementById('unten');
  const tafel = document.getElementById('tafel');
  const karte = document.getElementById('karte');

  let leben = HERZEN, laeuft = false, punkte = 0;
  let botAn = false;            // fährt die untere Hälfte der Rechner?
  let letzteWelt = null;
  let getroffenSperre = 0;          // Zeitpunkt, bis zu dem Treffer ignoriert werden
  let herzSperre = 0;
  const bereit = {};

  function an(rahmen, art, daten) {
    try {
      rahmen.contentWindow.postMessage(
        Object.assign({ schlitten: true, art: art }, daten || {}), '*');
    } catch (e) {}
  }
  function anBeide(art, daten) { an(oben, art, daten); an(unten, art, daten); }

  // Beide Hälften zeigen den gemeinsamen Vorrat in ihrer eigenen Anzeige.
  function lebenMelden() {
    anBeide('leben', { wert: leben, max: HERZEN });
  }

  function tafelZeigen(html, knoepfe) {
    karte.innerHTML = html;
    const leiste = document.createElement('div');
    knoepfe.forEach(function (k) {
      const b = document.createElement('button');
      b.textContent = k[0];
      b.onclick = k[1];
      leiste.appendChild(b);
    });
    karte.appendChild(leiste);
    tafel.classList.remove('weg');
  }

  function anfangsTafel() {
    tafelZeigen(
      '<h1>Vaas\u0027 Schrottschlitten — zu zweit</h1>' +
      '<p>Eine Strecke, zwei Schlitten. Dieselben Hindernisse kommen bei ' +
      'beiden im selben Augenblick — ihr springt also zusammen.</p>' +
      '<table>' +
      '<tr><td>' + NAME_OBEN + ' (oben)</td><td>Leertaste springen, S ducken</td></tr>' +
      '<tr><td>' + NAME_UNTEN + ' (unten)</td><td>Pfeil hoch springen, Pfeil runter ducken</td></tr>' +
      '</table>' +
      '<p>Ihr habt ' + HERZEN + ' Herzen zusammen. Jeder Treffer von jedem ' +
      'kostet eines. Sind sie weg, ist die Fahrt vorbei — für beide.</p>' +
      '<p style="color:#9fb4d8;font-size:13px">Zum Alleintesten fährt der ' +
      'Rechner die untere Hälfte. Er macht Fehler, damit die Herzen etwas zu tun haben.</p>',
      [['Zu zweit an einer Tastatur', function () { losfahren(false); }],
       ['Allein gegen den Bot',       function () { losfahren(true); }]]
    );
  }

  function losfahren(mitBot) {
    if (mitBot !== undefined) botAn = !!mitBot;
    document.getElementById('name-unten').textContent = botAn ? 'Rechner' : NAME_UNTEN;
    document.getElementById('tasten-unten').textContent = botAn
      ? 'fährt von selbst'
      : 'Pfeil hoch springen, Pfeil runter ducken';
    botNeu();
    leben = HERZEN;
    punkte = 0;
    getroffenSperre = 0;
    lebenMelden();
    tafel.classList.add('weg');
    laeuft = true;
    // Das Gelände kommt aus drei Zufallswerten. Beide bekommen dieselben,
    // sonst fahren sie über verschiedene Hügel.
    const phasen = [Math.random() * 7, Math.random() * 7, Math.random() * 7];
    anBeide('anfangen', { phasen: phasen, max: HERZEN });
    requestAnimationFrame(botSchritt);
  }

  function ende() {
    laeuft = false;
    anBeide('aus');
    let beste = 0;
    try { beste = parseInt(localStorage.getItem('schlitten_zwei_beste') || '0', 10) || 0; }
    catch (e) {}
    const neuerRekord = punkte > beste;
    if (neuerRekord) { try { localStorage.setItem('schlitten_zwei_beste', String(punkte)); } catch (e) {} }
    tafelZeigen(
      '<h1>' + (neuerRekord ? 'Beste Fahrt bisher' : 'Aus') + '</h1>' +
      '<p>Ihr seid zusammen auf <b>' + punkte + '</b> Punkte gekommen' +
      (neuerRekord ? '.' : ' — eure beste steht bei ' + beste + '.') + '</p>' +
      '<p>Nichts geht verloren, fahrt einfach nochmal.</p>',
      [['Nochmal', function () { losfahren(); }],
       [botAn ? 'Lieber zu zweit' : 'Lieber gegen den Bot',
        function () { losfahren(!botAn); }]]
    );
  }

  addEventListener('message', function (e) {
    const d = e.data;
    if (!d || d.schlitten !== true) return;

    if (d.art === 'bereit') { bereit[d.rolle] = true; return; }

    if (d.art === 'welt') {
      // Vom Meister zum Spiegel weiterreichen
      an(unten, 'welt', d);
      letzteWelt = d;
      if (typeof d.punkte === 'number') punkte = d.punkte;
      return;
    }

    if (d.art === 'crash') {
      if (!laeuft) return;
      // Beide melden denselben Baum kurz nacheinander — das ist ein Treffer,
      // nicht zwei. Deshalb eine kurze Sperre.
      const jetzt = performance.now();
      if (jetzt < getroffenSperre) return;
      getroffenSperre = jetzt + 900;
      leben--;
      lebenMelden();
      anBeide('getroffen');
      if (leben <= 0) ende();
      return;
    }

    if (d.art === 'herz') {
      if (!laeuft || leben >= HERZEN) return;
      const jetzt = performance.now();
      if (jetzt < herzSperre) return;       // beide melden dasselbe Herz
      herzSperre = jetzt + 600;
      leben++;
      lebenMelden();
      return;
    }
  });

  // Die Tasten fängt die Elternseite ab und verteilt sie. Sonst hört nur
  // der Rahmen zu, der gerade den Fokus hat.
  const TASTEN = {
    'Space':      { rahmen: 'oben',  was: 'sprung' },
    'KeyS':       { rahmen: 'oben',  was: 'ducken' },
    'ArrowUp':    { rahmen: 'unten', was: 'sprung' },
    'ArrowDown':  { rahmen: 'unten', was: 'ducken' }
  };
  function taste(e, runter) {
    const t = TASTEN[e.code];
    if (!t) return;
    e.preventDefault();
    if (runter && e.repeat) return;
    if (!laeuft) return;
    if (botAn && t.rahmen === 'unten') return;   // der Rechner fährt dort
    an(t.rahmen === 'oben' ? oben : unten, 'taste', { was: t.was, runter: runter });
  }
  addEventListener('keydown', function (e) { taste(e, true); });
  addEventListener('keyup',   function (e) { taste(e, false); });

  // ------------------------------------------------------------------
  // Der Bot für die untere Hälfte
  //
  // Er braucht im Spiel nichts: die Elternseite reicht die Welt ohnehin
  // durch und kennt damit jedes Hindernis mit seinem Abstand. Daraus
  // rechnet er, wann gedrückt werden muss, und schickt dieselben
  // Tastennachrichten wie ein Mensch.
  //
  // Der Schlitten steht bei 30 Prozent der Breite (SLED_X im Spiel).
  // Ein Sprung dauert rund 0,6 Sekunden, gehalten knapp 0,9. Deshalb
  // drückt er etwa ein Drittel einer Sekunde vorher.
  // ------------------------------------------------------------------
  const BOT_VORLAUF   = 0.34;   // Sekunden vor dem Hindernis springen
  const BOT_DUCK_VOR  = 0.30;   // Sekunden vor der Schranke ducken
  const BOT_FEHLER    = 0.06;   // Anteil der Hindernisse, die er verpatzt

  // Wann er wieder aufstehen darf, in Bildpunkten hinter dem Schlitten.
  // Das Spiel prüft die Berührung, solange die Schranke mit ihrer halben
  // Breite (48) noch in den Streifen um den Schlitten (30) ragt — also bis
  // 78 Bildpunkte dahinter. Vorher aufstehen heisst anstossen. Mit einer
  // Zugabe von 30 bleibt Luft, falls ein Bild ausfällt.
  const BOT_DUCK_RAUS = 48 + 30 + 30;

  // Wie weit hinter dem Schlitten er ein Hindernis noch beachtet. Muss
  // grösser sein als BOT_DUCK_RAUS, sonst verliert er die Schranke aus den
  // Augen und steht mitten in ihr auf.
  const BOT_RUECKSICHT = BOT_DUCK_RAUS + 60;

  let botErledigt = {};         // Hindernisse, die er schon behandelt hat
  let botDuckt = false, botSperre = 0;

  function botNeu() {
    botErledigt = {};
    botDuckt = false;
    botSperre = 0;
    letzteWelt = null;
  }

  function botTaste(was, runter) {
    an(unten, 'taste', { was: was, runter: runter });
  }

  function botSchritt() {
    if (!laeuft) { if (botDuckt) { botTaste('ducken', false); botDuckt = false; } return; }
    requestAnimationFrame(botSchritt);
    if (!botAn || !letzteWelt) return;

    const w = letzteWelt;
    const sx = unten.clientWidth * 0.30;
    const jetzt = performance.now();

    // Das nächste Hindernis vor dem Schlitten
    let naechstes = null, bestAb = Infinity;
    (w.hindernisse || []).forEach(function (hd) {
      const ab = (hd.wx - w.worldX) - sx;      // Abstand in Bildpunkten
      if (ab < -BOT_RUECKSICHT || ab > 1400) return;
      if (ab < bestAb) { bestAb = ab; naechstes = hd; }
    });

    if (!naechstes) {
      if (botDuckt) { botTaste('ducken', false); botDuckt = false; }
      return;
    }

    const zeit = bestAb / Math.max(1, w.tempo);   // Sekunden bis dorthin
    const marke = Math.round(naechstes.wx);

    if (naechstes.typ === 'schranke') {
      // Vorne nach Zeit, hinten nach Weg — hinten entscheidet die Breite
      // der Schranke, nicht das Tempo.
      const sollDucken = zeit < BOT_DUCK_VOR && bestAb > -BOT_DUCK_RAUS
                         && botErledigt[marke] !== 'daneben';
      if (sollDucken && !botDuckt) {
        if (botErledigt[marke] === undefined) {
          botErledigt[marke] = Math.random() < BOT_FEHLER ? 'daneben' : 'macht';
          if (botErledigt[marke] === 'daneben') return;
        }
        botTaste('ducken', true); botDuckt = true;
      } else if (!sollDucken && botDuckt) {
        botTaste('ducken', false); botDuckt = false;
      }
      return;
    }

    if (botDuckt) { botTaste('ducken', false); botDuckt = false; }
    if (botErledigt[marke] !== undefined) return;
    if (jetzt < botSperre) return;
    if (zeit > BOT_VORLAUF || zeit < 0) return;

    if (Math.random() < BOT_FEHLER) { botErledigt[marke] = 'daneben'; return; }
    botErledigt[marke] = 'springt';

    // Folgt gleich noch eines, wird der Sprung länger gehalten
    let folgt = false;
    (w.hindernisse || []).forEach(function (hd) {
      if (hd.wx > naechstes.wx && hd.wx - naechstes.wx < 220) folgt = true;
    });
    botTaste('sprung', true);
    botSperre = jetzt + 520;
    setTimeout(function () { botTaste('sprung', false); }, folgt ? 230 : 70);
  }

  document.getElementById('name-oben').textContent = NAME_OBEN;
  document.getElementById('name-unten').textContent = NAME_UNTEN;
  document.getElementById('tasten-unten').textContent = 'Pfeil hoch springen, Pfeil runter ducken';
  anfangsTafel();
})();
</script>
</body>
</html>
