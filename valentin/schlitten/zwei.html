<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vaas' Schrottschlitten — zu zweit</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #060d1c; color: #e8e4da;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    overflow: hidden; }
  #huelle { position: relative; height: 100%; display: flex; flex-direction: column; }
  .haelfte { position: relative; flex: 1 1 50%; min-height: 0; border: 0; width: 100%; }
  .haelfte iframe { width: 100%; height: 100%; border: 0; display: block; }
  #trenner { height: 2px; background: #3a4a6a; flex: none; }
  #uhr { flex: none; display: flex; align-items: baseline; gap: 14px;
    justify-content: center; padding: 5px 12px; background: #0a1222;
    border-bottom: 1px solid #1d2a44; font-size: 13px; color: #9fb4d8; }
  #uhr-zeit { font-size: 19px; font-weight: 600; color: #f0c173;
    font-variant-numeric: tabular-nums; letter-spacing: .02em; }
  #uhr.knapp #uhr-zeit { color: #e8a0a0; }
  #uhr-punkte { color: #6f85a8; }
  .schild { position: absolute; left: 10px; bottom: 8px; z-index: 3;
    display: flex; align-items: baseline; gap: 8px;
    font-size: 12px; color: #9fb4d8; background: rgba(6,13,28,0.72);
    padding: 4px 11px; border-radius: 12px; pointer-events: none; }
  .schild .name { font-size: 15px; font-weight: 600; color: #f0c173;
    letter-spacing: 0; text-transform: none; }
  .schild .tasten { letter-spacing: .06em; text-transform: uppercase; }
  #tafel { position: absolute; inset: 0; z-index: 9; display: flex;
    align-items: center; justify-content: center; padding: 24px;
    background: rgba(6,13,28,0.93); }
  #tafel.weg { display: none; }
  #karte { max-width: 520px; width: 100%; background: rgba(10,18,34,0.98);
    border: 2px solid #3a4a6a; border-radius: 12px; padding: 20px 22px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    box-shadow: 0 0 0 4px rgba(10,18,34,0.9), 0 0 40px rgba(240,193,115,0.08); }
  #karte h1 { margin: 0 0 10px; font-size: 19px; font-weight: 700; color: #f0c173;
    letter-spacing: .14em; text-transform: uppercase; text-align: center;
    text-shadow: 0 0 14px rgba(240,193,115,0.35); }
  #rangliste { margin: 2px 0 14px; border-top: 1px dashed #2a3a58;
    border-bottom: 1px dashed #2a3a58; padding: 8px 0; }
  #rangliste .kopf { display: flex; justify-content: space-between;
    font-size: 11px; letter-spacing: .14em; color: #5f7596; }
  #rangliste ol { list-style: none; margin: 0; padding: 0; }
  #rangliste li { display: flex; align-items: baseline; gap: 10px;
    font-size: 14px; color: #cdd8ea; padding: 2px 0; }
  #rangliste li .platz { width: 26px; color: #6f85a8; }
  #rangliste li .figur { flex: 1; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; }
  #rangliste li .zahl { color: #f0c173; font-variant-numeric: tabular-nums; }
  #rangliste li.eigen { color: #f0c173; }
  #rangliste .leer { font-size: 13px; color: #6f85a8; text-align: center; padding: 6px 0; }
  #namen { display: flex; gap: 8px; margin: 0 0 12px; }
  #namen input { flex: 1; min-width: 0; background: #0a1222; color: #ded6c2;
    border: 1px solid #2a3a58; border-radius: 6px; padding: 7px 10px;
    font: inherit; font-size: 14px; }
  #karte p { margin: 0 0 12px; font-size: 15px; line-height: 1.55; color: #cdd8ea; }
  #karte table { width: 100%; border-collapse: collapse; margin: 0 0 14px; font-size: 14px; }
  #karte td { padding: 5px 0; color: #cdd8ea; }
  #karte td:last-child { text-align: right; color: #9fb4d8; }
  #karte button { padding: 9px 18px; margin: 4px 6px 0 0; background: #1d2a44;
    color: #f0c173; border: 1px solid #3a4a6a; border-radius: 6px;
    font-size: 15px; cursor: pointer; }
</style>
</head>
<body>
<div id="huelle">
  <div id="uhr"><span id="uhr-zeit">2:00</span><span id="uhr-ziel"></span>
    <span id="uhr-punkte"></span></div>
  <div class="haelfte"><div class="schild"><span class="name" id="name-oben"></span><span class="tasten">Leertaste springen, S ducken</span></div>
    <iframe id="oben" src="quest-schlitten.html?sync=meister&abstand=1.5"></iframe></div>
  <div id="trenner"></div>
  <div class="haelfte"><div class="schild"><span class="name" id="name-unten"></span><span class="tasten" id="tasten-unten"></span></div>
    <iframe id="unten" src="quest-schlitten.html?sync=spiegel&abstand=1.5"></iframe></div>

  <div id="tafel"><div id="karte"></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function () {
  'use strict';

  // Gemeinsamer Vorrat für beide. Jeder Treffer von jedem kostet eines.
  const HERZEN = 5;

  // Das Ziel ist eine Zeit, keine Punktzahl. Daran arbeiten beide gleich
  // viel mit — jeder Crash von jedem kostet ein Herz, und niemand kann die
  // Zeit allein schneller vorbeibringen. Die Punkte laufen nebenher mit.
  // Mit ?ziel=90 lässt es sich zum Ausprobieren ändern.
  const ZIEL_ZEIT = Math.max(20, parseInt(
    new URLSearchParams(location.search).get('ziel') || '120', 10) || 120);

  function zeitText(s) {
    s = Math.max(0, Math.ceil(s));
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }

  // Namen kommen aus der Adresse: zwei.html?oben=Name&unten=Name
  // Aus dem Automaten im Haus heraus wird der Name der gespielten Figur
  // mitgegeben. Ohne Angabe steht da Spieler 1 und Spieler 2.
  const adresse = new URLSearchParams(location.search);
  function nameLesen(welche, vorgabe) {
    const ausAdresse = adresse.get(welche);
    if (ausAdresse) return ausAdresse.slice(0, 20);
    try {
      const g = localStorage.getItem('schlitten_name_' + welche);
      if (g) return g.slice(0, 20);
    } catch (e) {}
    return vorgabe;
  }
  let NAME_OBEN  = nameLesen('oben',  'Spieler 1');
  let NAME_UNTEN = nameLesen('unten', 'Spieler 2');

  function namenMerken() {
    try {
      localStorage.setItem('schlitten_name_oben', NAME_OBEN);
      localStorage.setItem('schlitten_name_unten', NAME_UNTEN);
    } catch (e) {}
  }

  function schilderMalen() {
    document.getElementById('name-oben').textContent = NAME_OBEN;
    document.getElementById('name-unten').textContent = botAn ? 'Rechner' : NAME_UNTEN;
  }

  // ------------------------------------------------------------------
  // Die Rangliste liegt im selben Supabase-Projekt wie das Haus.
  // Die Tabelle wird einmal mit rangliste.sql angelegt. Fehlt sie oder
  // ist das Projekt pausiert, läuft das Spiel trotzdem — dann steht in
  // der Lobby nur, dass gerade keine Rangliste da ist.
  // ------------------------------------------------------------------
  const NETZ_URL = 'https://uvnffzypgtrzgqtthdrn.supabase.co';
  const NETZ_SCHLUESSEL = 'sb_publishable_3q0OPU3U_DgYMcqSbacRqg_OVv7FofY';
  const TABELLE = 'schlitten_rangliste';

  let klient = null;
  try {
    if (NETZ_SCHLUESSEL && typeof supabase !== 'undefined') {
      klient = supabase.createClient(NETZ_URL, NETZ_SCHLUESSEL);
    }
  } catch (e) { klient = null; }

  let bestenliste = null;        // null = noch nicht geladen, [] = leer

  async function ranglisteLaden() {
    if (!klient) return;
    try {
      const { data, error } = await klient.from(TABELLE)
        .select('figur, punkte, geschafft')
        .order('punkte', { ascending: false })
        .limit(10);
      if (error) throw error;
      bestenliste = data || [];
    } catch (e) { bestenliste = null; }
  }

  async function ranglisteEintragen(eintraege) {
    if (!klient || !eintraege.length) return;
    try { await klient.from(TABELLE).insert(eintraege); } catch (e) {}
  }

  const oben  = document.getElementById('oben');
  const unten = document.getElementById('unten');
  const tafel = document.getElementById('tafel');
  const karte = document.getElementById('karte');

  let leben = HERZEN, laeuft = false, punkte = 0;
  let botAn = false;            // fährt die untere Hälfte der Rechner?
  let letzteWelt = null;
  let getroffenSperre = 0;          // Zeitpunkt, bis zu dem Treffer ignoriert werden
  let startZeit = 0, uebrig = ZIEL_ZEIT;
  const stand = { meister: 0, spiegel: 0 };
  let herzSperre = 0;
  const bereit = {};

  function an(rahmen, art, daten) {
    try {
      rahmen.contentWindow.postMessage(
        Object.assign({ schlitten: true, art: art }, daten || {}), '*');
    } catch (e) {}
  }
  function anBeide(art, daten) { an(oben, art, daten); an(unten, art, daten); }

  // Beide Hälften zeigen den gemeinsamen Vorrat in ihrer eigenen Anzeige.
  function lebenMelden() {
    anBeide('leben', { wert: leben, max: HERZEN });
  }

  function tafelZeigen(html, knoepfe) {
    karte.innerHTML = html;
    const leiste = document.createElement('div');
    knoepfe.forEach(function (k) {
      const b = document.createElement('button');
      b.textContent = k[0];
      b.onclick = k[1];
      leiste.appendChild(b);
    });
    karte.appendChild(leiste);
    tafel.classList.remove('weg');
  }

  function text(s) {
    return String(s).replace(/[&<>"]/g, function (z) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[z];
    });
  }

  function ranglisteHtml() {
    if (bestenliste === null) {
      return '<div id="rangliste"><div class="leer">Rangliste nicht erreichbar</div></div>';
    }
    if (!bestenliste.length) {
      return '<div id="rangliste"><div class="leer">Noch niemand gefahren</div></div>';
    }
    const zeilen = bestenliste.map(function (e, i) {
      const eigen = (e.figur === NAME_OBEN || e.figur === NAME_UNTEN) ? ' class="eigen"' : '';
      return '<li' + eigen + '><span class="platz">' + (i + 1) + '.</span>' +
             '<span class="figur">' + text(e.figur) + (e.geschafft ? ' \u2605' : '') + '</span>' +
             '<span class="zahl">' + e.punkte + '</span></li>';
    }).join('');
    return '<div id="rangliste">' +
           '<div class="kopf"><span>Beste Fahrten</span><span>Punkte</span></div>' +
           '<ol>' + zeilen + '</ol></div>';
  }

  function anfangsTafel() {
    tafelZeigen(
      '<h1>Vaas\u0027 Schrottschlitten</h1>' +
      ranglisteHtml() +
      '<p>Eine Strecke, zwei Schlitten. Haltet <b>' + zeitText(ZIEL_ZEIT) +
      '</b> zusammen durch \u2014 ' + HERZEN + ' Herzen f\u00fcr euch beide, ' +
      'jeder Treffer von jedem kostet eines.</p>' +
      '<p>Gesammelt wird getrennt. Was der eine aufhebt, liegt beim anderen ' +
      'noch da, und jeder kommt mit seiner eigenen Punktzahl in die Rangliste.</p>' +
      '<div id="namen">' +
      '<input id="feld-oben" maxlength="20" placeholder="oben" value="' + text(NAME_OBEN) + '">' +
      '<input id="feld-unten" maxlength="20" placeholder="unten" value="' + text(NAME_UNTEN) + '">' +
      '</div>',
      [['Zu zweit an einer Tastatur', function () { namenUebernehmen(); losfahren(false); }],
       ['Allein gegen den Bot',       function () { namenUebernehmen(); losfahren(true); }]]
    );
  }

  function namenUebernehmen() {
    const a = document.getElementById('feld-oben');
    const b = document.getElementById('feld-unten');
    if (a && a.value.trim()) NAME_OBEN = a.value.trim().slice(0, 20);
    if (b && b.value.trim()) NAME_UNTEN = b.value.trim().slice(0, 20);
    namenMerken();
    schilderMalen();
  }

  function losfahren(mitBot) {
    if (mitBot !== undefined) botAn = !!mitBot;
    schilderMalen();
    document.getElementById('tasten-unten').textContent = botAn
      ? 'fährt von selbst'
      : 'Pfeil hoch springen, Pfeil runter ducken';
    botNeu();
    leben = HERZEN;
    punkte = 0;
    getroffenSperre = 0;
    lebenMelden();
    stand.meister = 0; stand.spiegel = 0; punkte = 0;
    startZeit = performance.now();
    uebrig = ZIEL_ZEIT;
    uhrMalen();
    tafel.classList.add('weg');
    laeuft = true;
    // Das Gelände kommt aus drei Zufallswerten. Beide bekommen dieselben,
    // sonst fahren sie über verschiedene Hügel.
    const phasen = [Math.random() * 7, Math.random() * 7, Math.random() * 7];
    anBeide('anfangen', { phasen: phasen, max: HERZEN });
    requestAnimationFrame(botSchritt);
  }

  function uhrMalen() {
    document.getElementById('uhr-zeit').textContent = zeitText(uebrig);
    document.getElementById('uhr-ziel').textContent = 'von ' + zeitText(ZIEL_ZEIT);
    document.getElementById('uhr-punkte').textContent = 'Punkte ' + punkte;
    document.getElementById('uhr').classList.toggle('knapp', uebrig <= 15);
  }

  // Wer hat wie viel beigetragen? Der Bot kommt nicht in die Rangliste.
  function standHtml() {
    const zeile = (name, p) =>
      '<li><span class="platz"></span><span class="figur">' + text(name) +
      '</span><span class="zahl">' + p + '</span></li>';
    return '<div id="rangliste"><div class="kopf"><span>Diese Fahrt</span>' +
           '<span>Punkte</span></div><ol>' +
           zeile(NAME_OBEN, stand.meister) +
           zeile(botAn ? 'Rechner' : NAME_UNTEN, stand.spiegel) +
           '</ol></div>';
  }

  async function eintragenUndZeigen(geschafftJa, kopf, einleitung) {
    const eintraege = [{ figur: NAME_OBEN, punkte: stand.meister, geschafft: geschafftJa }];
    if (!botAn) eintraege.push({ figur: NAME_UNTEN, punkte: stand.spiegel, geschafft: geschafftJa });
    await ranglisteEintragen(eintraege);
    await ranglisteLaden();
    tafelZeigen(
      '<h1>' + kopf + '</h1>' + einleitung + standHtml() + ranglisteHtml(),
      [['Nochmal', function () { losfahren(); }],
       [botAn ? 'Lieber zu zweit' : 'Lieber gegen den Bot',
        function () { losfahren(!botAn); }]]
    );
  }

  function geschafft() {
    laeuft = false;
    anBeide('aus');
    tafelZeigen('<h1>Geschafft</h1><p>Einen Moment \u2026</p>', []);
    eintragenUndZeigen(true, 'Geschafft',
      '<p>Ihr habt ' + zeitText(ZIEL_ZEIT) + ' durchgehalten, mit <b>' + leben +
      '</b> von ' + HERZEN + ' Herzen \u00fcbrig.</p>');
  }

  function ende() {
    laeuft = false;
    anBeide('aus');
    const gehalten = ZIEL_ZEIT - uebrig;
    let beste = 0;
    try { beste = parseFloat(localStorage.getItem('schlitten_zwei_beste') || '0') || 0; }
    catch (e) {}
    const neuerRekord = gehalten > beste;
    if (neuerRekord) {
      try { localStorage.setItem('schlitten_zwei_beste', String(Math.round(gehalten))); }
      catch (e) {}
    }
    tafelZeigen('<h1>Aus</h1><p>Einen Moment \u2026</p>', []);
    eintragenUndZeigen(false, 'Aus',
      '<p>Ihr habt <b>' + zeitText(gehalten) + '</b> von ' + zeitText(ZIEL_ZEIT) +
      ' gehalten' + (neuerRekord ? ' \u2014 so weit wart ihr noch nie.'
                                 : '. Eure beste steht bei ' + zeitText(beste) + '.') + '</p>');
  }

  addEventListener('message', function (e) {
    const d = e.data;
    if (!d || d.schlitten !== true) return;

    if (d.art === 'bereit') { bereit[d.rolle] = true; return; }

    if (d.art === 'welt') {
      // Vom Meister zum Spiegel weiterreichen
      an(unten, 'welt', d);
      letzteWelt = d;
      return;
    }

    if (d.art === 'crash') {
      if (!laeuft) return;
      // Beide melden denselben Baum kurz nacheinander — das ist ein Treffer,
      // nicht zwei. Deshalb eine kurze Sperre.
      const jetzt = performance.now();
      if (jetzt < getroffenSperre) return;
      getroffenSperre = jetzt + 900;
      leben--;
      lebenMelden();
      anBeide('getroffen');
      if (leben <= 0) ende();
      return;
    }

    if (d.art === 'punkte') {
      if (d.rolle === 'meister' || d.rolle === 'spiegel') stand[d.rolle] = d.punkte | 0;
      punkte = stand.meister + stand.spiegel;
      return;
    }

    if (d.art === 'herz') {
      if (!laeuft || leben >= HERZEN) return;
      const jetzt = performance.now();
      if (jetzt < herzSperre) return;       // beide melden dasselbe Herz
      herzSperre = jetzt + 600;
      leben++;
      lebenMelden();
      return;
    }
  });

  // Die Tasten fängt die Elternseite ab und verteilt sie. Sonst hört nur
  // der Rahmen zu, der gerade den Fokus hat.
  const TASTEN = {
    'Space':      { rahmen: 'oben',  was: 'sprung' },
    'KeyS':       { rahmen: 'oben',  was: 'ducken' },
    'ArrowUp':    { rahmen: 'unten', was: 'sprung' },
    'ArrowDown':  { rahmen: 'unten', was: 'ducken' }
  };
  function taste(e, runter) {
    const t = TASTEN[e.code];
    if (!t) return;
    e.preventDefault();
    if (runter && e.repeat) return;
    if (!laeuft) return;
    if (botAn && t.rahmen === 'unten') return;   // der Rechner fährt dort
    an(t.rahmen === 'oben' ? oben : unten, 'taste', { was: t.was, runter: runter });
  }
  addEventListener('keydown', function (e) { taste(e, true); });
  addEventListener('keyup',   function (e) { taste(e, false); });

  // ------------------------------------------------------------------
  // Der Bot für die untere Hälfte
  //
  // Er braucht im Spiel nichts: die Elternseite reicht die Welt ohnehin
  // durch und kennt damit jedes Hindernis mit seinem Abstand. Daraus
  // rechnet er, wann gedrückt werden muss, und schickt dieselben
  // Tastennachrichten wie ein Mensch.
  //
  // Der Schlitten steht bei 30 Prozent der Breite (SLED_X im Spiel).
  // Ein Sprung dauert rund 0,6 Sekunden, gehalten knapp 0,9. Deshalb
  // drückt er etwa ein Drittel einer Sekunde vorher.
  // ------------------------------------------------------------------
  const BOT_VORLAUF   = 0.34;   // Sekunden vor dem Hindernis springen
  const BOT_DUCK_VOR  = 0.30;   // Sekunden vor der Schranke ducken
  const BOT_FEHLER    = 0.06;   // Anteil der Hindernisse, die er verpatzt

  // Wann er wieder aufstehen darf, in Bildpunkten hinter dem Schlitten.
  // Das Spiel prüft die Berührung, solange die Schranke mit ihrer halben
  // Breite (48) noch in den Streifen um den Schlitten (30) ragt — also bis
  // 78 Bildpunkte dahinter. Vorher aufstehen heisst anstossen. Mit einer
  // Zugabe von 30 bleibt Luft, falls ein Bild ausfällt.
  const BOT_DUCK_RAUS = 48 + 30 + 30;

  // Wie weit hinter dem Schlitten er ein Hindernis noch beachtet. Muss
  // grösser sein als BOT_DUCK_RAUS, sonst verliert er die Schranke aus den
  // Augen und steht mitten in ihr auf.
  const BOT_RUECKSICHT = BOT_DUCK_RAUS + 60;

  let botErledigt = {};         // Hindernisse, die er schon behandelt hat
  let botDuckt = false, botSperre = 0;

  function botNeu() {
    botErledigt = {};
    botDuckt = false;
    botSperre = 0;
    letzteWelt = null;
  }

  function botTaste(was, runter) {
    an(unten, 'taste', { was: was, runter: runter });
  }

  function botSchritt() {
    if (!laeuft) { if (botDuckt) { botTaste('ducken', false); botDuckt = false; } return; }
    requestAnimationFrame(botSchritt);

    uebrig = ZIEL_ZEIT - (performance.now() - startZeit) / 1000;
    uhrMalen();
    if (uebrig <= 0) { geschafft(); return; }

    if (!botAn || !letzteWelt) return;

    const w = letzteWelt;
    const sx = unten.clientWidth * 0.30;
    const jetzt = performance.now();

    // Das nächste Hindernis vor dem Schlitten
    let naechstes = null, bestAb = Infinity;
    (w.hindernisse || []).forEach(function (hd) {
      const ab = (hd.wx - w.worldX) - sx;      // Abstand in Bildpunkten
      if (ab < -BOT_RUECKSICHT || ab > 1400) return;
      if (ab < bestAb) { bestAb = ab; naechstes = hd; }
    });

    if (!naechstes) {
      if (botDuckt) { botTaste('ducken', false); botDuckt = false; }
      return;
    }

    const zeit = bestAb / Math.max(1, w.tempo);   // Sekunden bis dorthin
    const marke = Math.round(naechstes.wx);

    if (naechstes.typ === 'schranke') {
      // Vorne nach Zeit, hinten nach Weg — hinten entscheidet die Breite
      // der Schranke, nicht das Tempo.
      const sollDucken = zeit < BOT_DUCK_VOR && bestAb > -BOT_DUCK_RAUS
                         && botErledigt[marke] !== 'daneben';
      if (sollDucken && !botDuckt) {
        if (botErledigt[marke] === undefined) {
          botErledigt[marke] = Math.random() < BOT_FEHLER ? 'daneben' : 'macht';
          if (botErledigt[marke] === 'daneben') return;
        }
        botTaste('ducken', true); botDuckt = true;
      } else if (!sollDucken && botDuckt) {
        botTaste('ducken', false); botDuckt = false;
      }
      return;
    }

    if (botDuckt) { botTaste('ducken', false); botDuckt = false; }
    if (botErledigt[marke] !== undefined) return;
    if (jetzt < botSperre) return;
    if (zeit > BOT_VORLAUF || zeit < 0) return;

    if (Math.random() < BOT_FEHLER) { botErledigt[marke] = 'daneben'; return; }
    botErledigt[marke] = 'springt';

    // Folgt gleich noch eines, wird der Sprung länger gehalten
    let folgt = false;
    (w.hindernisse || []).forEach(function (hd) {
      if (hd.wx > naechstes.wx && hd.wx - naechstes.wx < 220) folgt = true;
    });
    botTaste('sprung', true);
    botSperre = jetzt + 520;
    setTimeout(function () { botTaste('sprung', false); }, folgt ? 230 : 70);
  }

  document.getElementById('name-oben').textContent = NAME_OBEN;
  document.getElementById('name-unten').textContent = NAME_UNTEN;
  document.getElementById('tasten-unten').textContent = 'Pfeil hoch springen, Pfeil runter ducken';
  uhrMalen();
  schilderMalen();
  anfangsTafel();
  ranglisteLaden().then(anfangsTafel);
})();
</script>
</body>
</html>
