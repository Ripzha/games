<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Das Klavier im Salon</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: #0a0908; color: #ded6c2;
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  #buehne { position: relative; width: 100%; height: 100%; overflow: hidden; }
</style>
</head>
<body>
<div id="buehne"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function () {
"use strict";

// ======================================================================
// Das Klavier im Salon — die erste Aufgabe zu zweit
//
//    Zwei Leute spielen ein Stück gemeinsam. Die Melodie wechselt in
//    Phrasen zwischen beiden. Gewertet wird gemeinsam über das ganze
//    Stück, nicht gegeneinander.
//
//    Diese Seite läuft in einem Rahmen im Haus und bekommt alles, was
//    sie braucht, in der Adresse:
//      ?figur=chase     wer ich bin
//      &ich=abc123      meine Kennung
//      &partner=def456  die Kennung des Mitspielers
//      &kanal=kl-...    der gemeinsame Kanal
//    Ohne Kanal läuft sie allein, mit dem Übungspartner.
//
//    Zum Haus hin gibt es zwei Nachrichten: "fertig", wenn zugemacht
//    werden soll, und "geloest", wenn das Stück geschafft ist.
// ======================================================================

const adresse = new URLSearchParams(location.search);
const ICH = adresse.get("ich") || ("x" + Math.random().toString(36).slice(2, 8));
const PARTNER_ID = adresse.get("partner") || "";
const KANAL_NAME = adresse.get("kanal") || "";

const NETZ_URL = "https://uvnffzypgtrzgqtthdrn.supabase.co";
const NETZ_SCHLUESSEL = "sb_publishable_3q0OPU3U_DgYMcqSbacRqg_OVv7FofY";

function melden(was) {
  if (!window.parent || window.parent === window) return;
  try { window.parent.postMessage(Object.assign({ klavier: true }, was), "*"); }
  catch (e) {}
}

let klavierOffen   = false;
let klavierGeloest = false;    // wird wahr, sobald das Stück geschafft ist

// ----------------------------------------------------------------------
// Die Klaviatur. Weiss C4 bis F5, schwarz dazwischen.
// kuerzel = die Taste am Rechner (Grundreihe weiss, obere Reihe schwarz).
// ----------------------------------------------------------------------
const KL_WEISS = [
  { note: "C4",  freq: 261.63, kuerzel: "A" },
  { note: "D4",  freq: 293.66, kuerzel: "S" },
  { note: "E4",  freq: 329.63, kuerzel: "D" },
  { note: "F4",  freq: 349.23, kuerzel: "F" },
  { note: "G4",  freq: 392.00, kuerzel: "G" },
  { note: "A4",  freq: 440.00, kuerzel: "H" },
  { note: "H4",  freq: 493.88, kuerzel: "J" },
  { note: "C5",  freq: 523.25, kuerzel: "K" },
  { note: "D5",  freq: 587.33, kuerzel: "L" },
  { note: "E5",  freq: 659.25, kuerzel: "Ö" },
  { note: "F5",  freq: 698.46, kuerzel: "Ä" }
];
// Die schwarzen Tasten liegen auf der Reihe darüber, jede über ihrer
// eigenen Lücke. Dadurch bleibt jede Hand an ihrem Platz: die linke auf
// A S D F mit T darüber, die rechte auf H J K L Ö mit O darüber.
const KL_SCHWARZ = [
  { note: "Cis4", freq: 277.18, kuerzel: "W", nach: 0 },
  { note: "Dis4", freq: 311.13, kuerzel: "E", nach: 1 },
  { note: "Fis4", freq: 369.99, kuerzel: "R", nach: 3 },
  { note: "Gis4", freq: 415.30, kuerzel: "T", nach: 4 },
  { note: "Ais4", freq: 466.16, kuerzel: "Z", nach: 5 },
  { note: "Cis5", freq: 554.37, kuerzel: "I", nach: 7 },
  { note: "Dis5", freq: 622.25, kuerzel: "O", nach: 8 }
];

const KL_ALLE = {};
KL_WEISS.forEach((t)   => (KL_ALLE[t.note] = t));
KL_SCHWARZ.forEach((t) => (KL_ALLE[t.note] = t));

const KL_VON_TASTE = {};
KL_WEISS.forEach((t)   => (KL_VON_TASTE[t.kuerzel.toLowerCase()] = t.note));
KL_SCHWARZ.forEach((t) => (KL_VON_TASTE[t.kuerzel.toLowerCase()] = t.note));

// ----------------------------------------------------------------------
// Das Stück. Greensleeves, England, 16. Jahrhundert, gemeinfrei.
//
// ACHTUNG: aus dem Gedächtnis geschrieben, nicht aus Noten abgeschrieben.
// Der Knopf "Erst mal anhören" spielt es vor — wer einen falschen Ton
// hört, ändert ihn hier. Die Zahl hinter dem Ton ist die Länge in
// Zählern, ein Zähler ist KL_ZAEHLER Millisekunden.
//
// wer: 0 = der Spieler an diesem Rechner, 1 = der Mitspieler.
// Die Phrasen wechseln sich ab, damit niemand lange nichts zu tun hat.
// ----------------------------------------------------------------------
const KL_ZAEHLER = 200;      // Millisekunden pro Sechzehntel
const KL_PAUSE   = 1.5;      // Zähler Pause zwischen zwei Phrasen

// Pachelbels Kanon in D, nach C-Dur versetzt, damit er in den Umfang
// der Klaviatur passt (C4 bis F5).
//
// Die beiden spielen nicht abwechselnd, sondern gleichzeitig: Einer
// nimmt die Basslinie, die den ganzen Kanon trägt und immer dieselbe
// bleibt, der andere die Melodie darüber. Erst zusammen ergibt es das
// Stück — allein klingt jede Stimme unvollständig, und das ist der
// Sinn der Sache.
//
// Die Basslinie liegt unten auf der Klaviatur, die Melodie oben. So
// sieht jeder auf einen Blick, welche Hälfte ihm gehört, und die beiden
// kommen sich auf keiner Taste in die Quere.
//
// Zwei Stimmen, jede eine Folge von [Note, Länge in Zählzeiten].
// Beethovens „Für Elise", der erste Teil, zweimal durch.
//
// Beide spielen beides: Zur Hälfte tauschen sie die Stimmen, wer die
// rechte Hand angefangen hat, übernimmt dann die linke. Gleich viele
// Noten allein wäre nicht gleich schwer — die rechte Hand hat die
// Melodie, die linke die Begleitung.
//
// In jeder Stimme stehen Griffe: zwei Töne, die gleichzeitig kommen.
// Dafür braucht man beide Hände, und das ist der Unterschied zu einer
// Melodie, die man mit einem Finger abarbeiten kann.
//
// Eine Länge ist ein Sechzehntel. null ist eine Pause — bei Für Elise
// spielen die Hände abwechselnd, ohne Pausen ginge das nicht.
const KL_TAUSCH = 58;        // Zählzeiten bis zum Stimmentausch

// Die linke Hand liegt im Original zwei Oktaven tiefer. So tief reicht
// die Klaviatur nicht, deshalb sind die Arpeggien umgelegt: Statt zum
// Spitzenton hinauf gehen sie wieder zurück. Sonst läge dieselbe Note
// gleichzeitig in beiden Stimmen und beide wären auf einer Taste.
const KL_LINKS_TEIL = (schluss) => [
  [null, 8],
  ["C4", 1], ["E4", 1], ["C4", 1], [null, 3],
  ["E4", 1], ["Gis4", 1], ["E4", 1], [null, 3],
  [["A4", "C4"], 1], [null, 5],
  [null, 8],
  ["C4", 1], ["E4", 1], ["C4", 1], [null, 3],
  ["E4", 1], ["Gis4", 1], ["E4", 1], [null, 3],
  ["F4", 1], ["D4", 1], ["F4", 1], [null, 3],
  [schluss, 4], [null, 2]
];

const KL_RECHTS_TEIL = (schluss) => [
  ["E5", 1], ["Dis5", 1], ["E5", 1], ["Dis5", 1],
  ["E5", 1], ["H4", 1], ["D5", 1], ["C5", 1],
  [["F4", "A4"], 2], [null, 4],
  ["H4", 2], [null, 4],
  ["C5", 2], [null, 4],
  ["E5", 1], ["Dis5", 1], ["E5", 1], ["Dis5", 1],
  ["E5", 1], ["H4", 1], ["D5", 1], ["C5", 1],
  [["F4", "A4"], 2], [null, 4],
  ["H4", 2], [null, 2], ["C5", 1], ["E5", 1],
  [schluss, 4], [null, 8]
];

const KL_RECHTS = KL_RECHTS_TEIL(["A4", "C5"]).concat(KL_RECHTS_TEIL(["A4", "C5"]));
const KL_LINKS  = KL_LINKS_TEIL(["D4", "F4"]).concat(KL_LINKS_TEIL(["C4", "E4"]));






// ----------------------------------------------------------------------
// Zeiten und Schwellen
// ----------------------------------------------------------------------
const KL_FALLZEIT = 2600;    // Millisekunden von oben bis zur Treffleiste
const KL_PERFEKT  = 80;      // plus/minus Millisekunden für die volle Wertung
// Das Trefferfenster muss schmaler sein als der Abstand zwischen zwei
// gleichen Noten, sonst wertet ein Druck die falsche. Bei Sechzehnteln
// sind das 400 Millisekunden, also höchstens 200 nach jeder Seite.
const KL_GUT      = 160;     // plus/minus Millisekunden, sonst verpasst
const KL_VORLAUF  = 1600;    // Ruhe vor dem ersten Ton
const KL_SCHWELLE = 80;      // Prozent, ab denen es geschafft ist

// ----------------------------------------------------------------------
// Der Mitspieler.
//
// Heute ein Übungspartner im selben Browser. Später kommt hier die
// Verbindung über Supabase hinein. Was ausgetauscht werden muss, ist
// wenig: ein gemeinsamer Startzeitpunkt und pro Note ein Ergebnis.
// Der Tastendruck selbst geht nie über die Leitung — jeder bewertet
// bei sich, sonst entscheidet die Verzögerung über das Spiel.
//
//   starten(song, melden)  wird beim Start gerufen. melden(index, gut)
//                          meldet einen Treffer des Mitspielers.
//   beenden()              räumt auf.
// ----------------------------------------------------------------------
// Welche Hälfte des Stücks spiele ich? Beim Übungspartner immer die
// erste. Mit einem echten Mitspieler entscheidet der Vergleich der
// beiden Kennungen — die kleinere spielt die erste Hälfte. Beide rechnen
// dasselbe aus, deshalb braucht es dafür keine Absprache.
let klIchBin = 0;
function klSeiteBestimmen(partnerId) {
  klIchBin = partnerId && String(ICH) > String(partnerId) ? 1 : 0;
}

// Allein, mit dem Übungspartner, darf man sich die Seite aussuchen —
// sonst übt man immer nur die Hälfte, die man zufällig bekommen hat.
// Mit einem echten Mitspieler entscheiden die Kennungen, da gibt es
// nichts zu wählen.
const klDarfWaehlen = () => !PARTNER_ID;
function klSeiteWechseln() {
  if (!klDarfWaehlen()) return;
  klIchBin = klIchBin === 0 ? 1 : 0;
  klTafelStart();
}
const klAnderer = () => (klIchBin === 0 ? 1 : 0);

const KL_PARTNER = {
  name: "Übungspartner",
  _uhren: [],
  starten(song, melden, startZeit) {
    this._uhren = [];
    song.noten.forEach((n, i) => {
      if (n.wer !== klAnderer()) return;
      // Der Partner trifft nicht auf die Millisekunde genau.
      const versatz = (Math.random() - 0.5) * 220;
      const daneben = Math.random() > 0.92;          // ab und zu ein Fehler
      const wann = startZeit + n.zeit + versatz - performance.now();
      this._uhren.push(
        setTimeout(() => {
          if (daneben) melden(i, null);
          else melden(i, Math.abs(versatz) <= KL_PERFEKT);
        }, Math.max(0, wann))
      );
    });
  },
  beenden() {
    this._uhren.forEach(clearTimeout);
    this._uhren = [];
  }
};

// ----------------------------------------------------------------------
// Ton
// ----------------------------------------------------------------------
let klAudio = null;
function klTonWerk() {
  if (!klAudio) {
    try { klAudio = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { return null; }
  }
  if (klAudio.state === "suspended") klAudio.resume();
  return klAudio;
}
function klTon(freq, dauerMs, leise) {
  const c = klTonWerk();
  if (!c) return;
  const jetzt = c.currentTime;
  const dauer = Math.max(0.5, (dauerMs || 500) / 1000 + 0.35);
  const filter = c.createBiquadFilter();
  filter.type = "lowpass";
  filter.frequency.value = 3200;
  filter.Q.value = 0.5;
  filter.connect(c.destination);
  const laut = leise ? 0.45 : 1;
  // Grundton und zwei Obertöne, das klingt nach Klavier genug
  [[1, 0.20], [2, 0.07], [3, 0.025]].forEach(([mal, staerke]) => {
    const o = c.createOscillator(), g = c.createGain();
    o.type = "sine";
    o.frequency.value = freq * mal;
    g.gain.setValueAtTime(0, jetzt);
    g.gain.linearRampToValueAtTime(staerke * laut, jetzt + 0.008);
    g.gain.exponentialRampToValueAtTime(0.001, jetzt + dauer);
    o.connect(g).connect(filter);
    o.start(jetzt);
    o.stop(jetzt + dauer);
  });
}

// ----------------------------------------------------------------------
// Das Stück in eine Notenliste mit Zeiten umrechnen
// ----------------------------------------------------------------------
function klStimmeBauen(stimme, wer, noten) {
  let t = 0;
  stimme.forEach(([note, laenge]) => {
    if (note) {
      // Nach dem Tausch gehört die Stimme dem anderen
      const wessen = t < KL_TAUSCH ? wer : (wer === 0 ? 1 : 0);
      const gleichzeitig = Array.isArray(note) ? note : [note];
      gleichzeitig.forEach((einzeln) => {
        noten.push({
          zeit: t * KL_ZAEHLER,
          dauer: laenge * KL_ZAEHLER,
          note: einzeln,
          wer: wessen,
          stand: "offen"
        });
      });
    }
    t += laenge;                        // null ist eine Pause
  });
  return t * KL_ZAEHLER;
}

function klSongBauen() {
  const noten = [];
  // Beide Stimmen beginnen zur selben Zeit. Wer welche spielt, steht
  // in KL_BASS_WER — das entscheidet sich aus den Kennungen.
  const a = klStimmeBauen(KL_LINKS, 0, noten);
  const b = klStimmeBauen(KL_RECHTS, 1, noten);
  noten.sort((x, y) => x.zeit - y.zeit);
  return { noten, laenge: Math.max(a, b) };
}

// ----------------------------------------------------------------------
// Die Oberfläche. Sie wird beim ersten Aufruf gebaut und danach nur noch
// ein- und ausgeblendet.
// ----------------------------------------------------------------------
let klBau = null;

function klStil() {
  if (document.getElementById("klavier-stil")) return;
  const s = document.createElement("style");
  s.id = "klavier-stil";
  s.textContent = `
  #klavier { position: absolute; inset: 0; display: none; flex-direction: column;
             background: rgba(8,7,6,0.94); z-index: 5; }
  #klavier.auf { display: flex; }
  #kl-kopf { display: flex; justify-content: space-between; align-items: baseline;
             padding: 10px 16px; font-size: 13px; color: #8a857a; flex: none; }
  #kl-kopf b { color: #f0c173; font-weight: 500; }
  #kl-feld { position: relative; flex: 1; overflow: hidden; }
  #kl-leiste { position: absolute; left: 0; right: 0; bottom: 0; height: 2px;
               background: #c9a06a; opacity: .8; }
  .kl-note { position: absolute; border-radius: 4px; display: flex;
             align-items: center; justify-content: center;
             font-size: 12px; font-weight: 600; color: #1a1510;
             background: #f0c173; box-shadow: 0 0 14px rgba(240,193,115,.35); }
  .kl-note.fremd { background: #3b352a; color: #6d6659; box-shadow: none; }
  .kl-note.getroffen { background: #8fd49a; transition: opacity .3s; opacity: 0; }
  .kl-note.verpasst  { background: #7a4040; color: #d8b0b0; }
  #kl-tasten { position: relative; flex: none; height: 26%; min-height: 76px;
               display: flex; padding: 0 10px 10px; }
  .kl-weiss { position: relative; flex: 1; margin: 0 1px; border-radius: 0 0 5px 5px;
              background: linear-gradient(#f6f0e4, #ded6c2); color: #4a4335;
              display: flex; align-items: flex-end; justify-content: center;
              padding-bottom: 6px; font-size: 12px; font-weight: 600; cursor: pointer;
              user-select: none; -webkit-user-select: none; }
  .kl-schwarz { position: absolute; top: 0; height: 58%; border-radius: 0 0 4px 4px;
                background: linear-gradient(#2a2720, #15130f); color: #a39b8a;
                display: flex; align-items: flex-end; justify-content: center;
                padding-bottom: 5px; font-size: 11px; font-weight: 600; cursor: pointer;
                user-select: none; -webkit-user-select: none; z-index: 2; }
  .kl-weiss.an   { background: linear-gradient(#f0c173, #d9a85c); }
  .kl-schwarz.an { background: linear-gradient(#6b5420, #4a3a16); color: #f0c173; }
  #kl-urteil { position: absolute; left: 0; right: 0; top: 14%; text-align: center;
               font-size: 22px; font-weight: 500; opacity: 0; pointer-events: none; }
  #kl-urteil.zeig { animation: kl-auf .5s ease both; }
  @keyframes kl-auf { 0% { opacity: 0; transform: translateY(8px) }
                      35% { opacity: 1; transform: none }
                      100% { opacity: 0 } }
  #kl-tafel { position: absolute; inset: 0; display: flex; align-items: center;
              justify-content: center; padding: 24px; background: rgba(8,7,6,0.9); z-index: 6; }
  #kl-tafel.weg { display: none; }
  #kl-karte { max-width: 480px; width: 100%; background: rgba(16,14,11,0.98);
              border: 1px solid #5a4a1c; border-radius: 12px; padding: 22px 24px; }
  #kl-karte h2 { margin: 0 0 10px; font-size: 19px; font-weight: 500; color: #f0c173; }
  #kl-karte p  { margin: 0 0 12px; font-size: 15px; line-height: 1.55; color: #ded6c2; }
  #kl-karte button { padding: 9px 18px; margin: 4px 6px 0 0; background: #3a2f12;
              color: #f0c173; border: 1px solid #5a4a1c; border-radius: 6px;
              font-size: 15px; cursor: pointer; }
  `;
  document.head.appendChild(s);
}

function klOberflaeche() {
  if (klBau) return klBau;
  klStil();

  const wurzel = document.createElement("div");
  wurzel.id = "klavier";
  wurzel.innerHTML =
    '<div id="kl-kopf"><span id="kl-stand"></span><span id="kl-wer"></span></div>' +
    '<div id="kl-feld"><div id="kl-urteil"></div><div id="kl-leiste"></div></div>' +
    '<div id="kl-tasten"></div>' +
    '<div id="kl-tafel"><div id="kl-karte"></div></div>';
  document.getElementById("buehne").appendChild(wurzel);

  const reihe = wurzel.querySelector("#kl-tasten");
  const tastenEl = {};

  KL_WEISS.forEach((t) => {
    const el = document.createElement("div");
    el.className = "kl-weiss";
    el.textContent = t.kuerzel;
    reihe.appendChild(el);
    tastenEl[t.note] = el;
    el.addEventListener("pointerdown", (e) => { e.preventDefault(); klEingabe(t.note); });
  });
  KL_SCHWARZ.forEach((t) => {
    const el = document.createElement("div");
    el.className = "kl-schwarz";
    el.textContent = t.kuerzel;
    reihe.appendChild(el);
    tastenEl[t.note] = el;
    el.addEventListener("pointerdown", (e) => { e.preventDefault(); klEingabe(t.note); });
  });

  klBau = {
    wurzel,
    feld:   wurzel.querySelector("#kl-feld"),
    stand:  wurzel.querySelector("#kl-stand"),
    wer:    wurzel.querySelector("#kl-wer"),
    urteil: wurzel.querySelector("#kl-urteil"),
    tafel:  wurzel.querySelector("#kl-tafel"),
    karte:  wurzel.querySelector("#kl-karte"),
    tastenEl
  };
  klSchwarzeSetzen();
  window.addEventListener("resize", klSchwarzeSetzen);
  return klBau;
}

// Die schwarzen Tasten sitzen auf der Fuge zwischen zwei weissen.
function klSchwarzeSetzen() {
  if (!klBau) return;
  const weiss = KL_WEISS.map((t) => klBau.tastenEl[t.note]);
  if (!weiss[0] || !weiss[0].offsetWidth) return;
  const reihe = klBau.wurzel.querySelector("#kl-tasten");
  const links0 = reihe.getBoundingClientRect().left;
  KL_SCHWARZ.forEach((t) => {
    const w = weiss[t.nach].getBoundingClientRect();
    const breite = w.width * 0.62;
    const el = klBau.tastenEl[t.note];
    el.style.width = breite + "px";
    el.style.left = (w.right - links0 - breite / 2) + "px";
  });
}

// ----------------------------------------------------------------------
// Spielzustand
// ----------------------------------------------------------------------
let klSong = null;
let klLaeuft = false, klVorspiel = false;
let klStart = 0, klSchleife = null;
let klPunkte = 0, klMoeglich = 0;

function klUrteil(text, farbe) {
  const el = klBau.urteil;
  el.textContent = text;
  el.style.color = farbe;
  el.classList.remove("zeig");
  void el.offsetWidth;
  el.classList.add("zeig");
}
function klBlitz(note) {
  const el = klBau.tastenEl[note];
  if (!el) return;
  el.classList.add("an");
  setTimeout(() => el.classList.remove("an"), 150);
}

// ----------------------------------------------------------------------
// Öffnen und schliessen
// ----------------------------------------------------------------------
function klavierStarten() {
  klOberflaeche();
  klavierOffen = true;
  klBau.wurzel.classList.add("auf");
  klSchwarzeSetzen();
  klTafelStart();
}

function klavierSchliessen() {
  klAbbrechen();
  // Die Seite macht sich nicht selbst zu — das Haus hat den Rahmen.
  melden({ art: "fertig" });
}

function klAbbrechen() {
  klLaeuft = false;
  KL_PARTNER.beenden();
  if (klSchleife) cancelAnimationFrame(klSchleife);
  klSchleife = null;
  if (klBau) klBau.feld.querySelectorAll(".kl-note").forEach((n) => n.remove());
}

// ----------------------------------------------------------------------
// Die Tafeln davor und danach
// ----------------------------------------------------------------------
function klTafelZeigen(html, knoepfe) {
  klBau.karte.innerHTML = html;
  const leiste = document.createElement("div");
  knoepfe.forEach(([text, tun]) => {
    const b = document.createElement("button");
    b.textContent = text;
    b.onclick = tun;
    leiste.appendChild(b);
  });
  klBau.karte.appendChild(leiste);
  klBau.tafel.classList.remove("weg");
}

function klTafelStart() {
  klTafelZeigen(
    "<h2>Das Klavier</h2>" +
    "<p>Auf dem Pult liegt Für Elise, gesetzt für vier Hände. Ihr spielt " +
    "gleichzeitig: Einer nimmt die rechte Hand, der andere die linke — und zur " +
    "Hälfte tauscht ihr. Wo zwei Noten nebeneinander kommen, brauchst du beide " +
    "Hände. Deine Noten sind hell und tragen einen Buchstaben, die des anderen " +
    "bleiben dunkel.</p>" +
    "<p style='color:#8fd49a'>Linke Hand auf A S D F, die rechte auf H J K L Ö. " +
    "Darüber liegen T und O. Mehr brauchst du nicht — die Hände bleiben, wo " +
    "sie sind.</p>" +
    "<p>Drück die Taste, wenn die Note unten ankommt. Gewertet wird " +
    "gemeinsam über das ganze Stück. Ab " + KL_SCHWELLE + " Prozent geht es auf.</p>" +
    "<p style='color:#8a857a;font-size:13px'>Mitspieler: " + KL_PARTNER.name +
    (klDarfWaehlen()
      ? " &nbsp;·&nbsp; du f\u00e4ngst mit " +
        (klIchBin === 0 ? "der linken Hand" : "der rechten Hand") + " an"
      : "") + "</p>",
    klDarfWaehlen()
      ? [
          ["Erst mal anhören", () => klSpielStarten(true)],
          ["Spielen",          () => klSpielStarten(false)],
          [klIchBin === 0 ? "Lieber die linke Hand" : "Lieber die rechte Hand",
                               klSeiteWechseln],
          ["Zurück",           klavierSchliessen]
        ]
      : [
          ["Erst mal anhören", () => klSpielStarten(true)],
          ["Spielen",          () => klSpielStarten(false)],
          ["Zurück",           klavierSchliessen]
        ]
  );
}

function klTafelEnde(prozent) {
  if (prozent >= KL_SCHWELLE) {
    klavierGeloest = true;
    melden({ art: "geloest" });
    klTafelZeigen(
      "<h2>Es klingt</h2>" +
      "<p>Ihr seid zusammen durchgekommen — " + prozent + " Prozent.</p>" +
      "<p><i>Platzhalter — hier kommt, was das gelöste Klavier auswirft. " +
      "Noch nicht entschieden.</i></p>",
      [["Zurück", klavierSchliessen]]
    );
  } else {
    klTafelZeigen(
      "<h2>Das war daneben</h2>" +
      "<p>" + prozent + " Prozent. Es braucht " + KL_SCHWELLE + ".</p>" +
      "<p>Nichts geht verloren, ihr könnt es so oft versuchen, wie ihr wollt.</p>",
      [
        ["Nochmal",         () => klSpielStarten(false)],
        ["Erst mal anhören", () => klSpielStarten(true)],
        ["Zurück",          klavierSchliessen]
      ]
    );
  }
}

// ----------------------------------------------------------------------
// Der Durchgang
// ----------------------------------------------------------------------
function klSpielStarten(nurHoeren) {
  klTonWerk();
  klAbbrechen();
  klSong = klSongBauen();
  klVorspiel = !!nurHoeren;
  klLaeuft = true;
  klPunkte = 0;
  klMoeglich = klSong.noten.length * 100;
  klBau.tafel.classList.add("weg");
  klBau.stand.textContent = "";
  klBau.wer.textContent = nurHoeren ? "Vorspiel" : "";

  klSong.noten.forEach((n) => {
    const el = document.createElement("div");
    el.className = "kl-note" + (n.wer !== klIchBin ? " fremd" : "");
    el.textContent = n.wer === klIchBin ? KL_ALLE[n.note].kuerzel : "";
    el.style.display = "none";
    klBau.feld.appendChild(el);
    n.el = el;
    n.stand = "offen";
    n.getoent = false;
  });

  // Gemeinsam anfangen. Ohne das setzt jeder beim Druck auf "Spielen"
  // seine eigene Uhr, und die beiden Stimmen laufen um so viel
  // auseinander, wie die beiden Klicks auseinanderliegen.
  //
  // Der Übungspartner und das Vorspiel fangen sofort an. Mit einem
  // echten Mitspieler meldet jeder "bereit", und wer die kleinere
  // Kennung hat, gibt das Zeichen. Beide starten darauf hin — übrig
  // bleibt der einfache Weg einer Nachricht, also ein Bruchteil dessen,
  // was zwei Klicks auseinanderliegen.
  const losgehen = () => {
    klStart = performance.now() + KL_VORLAUF;
    if (!nurHoeren) KL_PARTNER.starten(klSong, klPartnerMeldet, klStart);
    klSchleife = requestAnimationFrame(klSchritt);
  };

  if (nurHoeren || !KL_PARTNER.abstimmen) { losgehen(); return; }
  klBau.wer.textContent = "warte auf den anderen …";
  if (!KL_PARTNER.abstimmen(losgehen)) losgehen();
}

// Der Mitspieler meldet ein Ergebnis für seine Note.
// gut === true  perfekt, gut === false knapp, gut === null daneben.
function klPartnerMeldet(index, gut) {
  if (!klLaeuft) return;
  const n = klSong.noten[index];
  if (!n || n.stand !== "offen") return;
  if (gut === null) {
    n.stand = "verpasst";
    n.el.classList.add("verpasst");
    setTimeout(() => { n.el.style.display = "none"; }, 500);
    return;
  }
  n.stand = "getroffen";
  n.el.classList.add("getroffen");
  setTimeout(() => { n.el.style.display = "none"; }, 320);
  // Kein Ton an dieser Stelle. Die Stimme des anderen klingt örtlich zu
  // ihrer eigenen Zeit aus den Noten — käme sie erst mit der Nachricht,
  // steckte die Netzverzögerung in der Musik.
  klPunkte += gut ? 100 : 80;
  klStandAnzeigen();
}

function klStandAnzeigen() {
  const bisher = klSong.noten.filter((n) => n.stand !== "offen").length;
  if (!bisher) { klBau.stand.textContent = ""; return; }
  const prozent = Math.round((klPunkte / (bisher * 100)) * 100);
  klBau.stand.innerHTML = "zusammen <b>" + prozent + " %</b>";
}

function klSchritt(jetzt) {
  if (!klLaeuft) return;
  const t = jetzt - klStart;
  const hoehe = klBau.feld.clientHeight;
  const breite = klBau.feld.clientWidth;
  const feldLinks = klBau.feld.getBoundingClientRect().left;

  klSong.noten.forEach((n) => {
    const dt = n.zeit - t;                       // Millisekunden bis zum Treffpunkt
    if (dt < KL_FALLZEIT && dt > -600 &&
        (n.stand === "offen" || n.stand === "verpasst")) {
      const taste = klBau.tastenEl[n.note];
      if (taste) {
        const r = taste.getBoundingClientRect();
        const b = Math.min(r.width - 4, 58);
        const h = Math.max(24, n.dauer / 14);
        const x = r.left - feldLinks + (r.width - b) / 2;
        const y = hoehe - (dt / KL_FALLZEIT) * (hoehe + 80) - h;
        n.el.style.display = "flex";
        n.el.style.width = b + "px";
        n.el.style.height = h + "px";
        n.el.style.transform = "translate(" + x + "px," + y + "px)";
      }
    }

    // Vorspiel: alles läuft von selbst
    if (klVorspiel && n.stand === "offen" && dt <= 0) {
      n.stand = "auto";
      klTon(KL_ALLE[n.note].freq, n.dauer);
      klBlitz(n.note);
      n.el.classList.add("getroffen");
    }

    // Verpasst — nur die eigenen Noten, die des Partners meldet der Partner
    // Die Stimme des anderen klingt leiser mit, sobald sie an der Leiste
    // ankommt. Dadurch hören beide dasselbe Stück, unabhängig davon, wie
    // lange eine Nachricht unterwegs ist.
    if (n.wer !== klIchBin && !n.getoent && dt >= 0) {
      n.getoent = true;
      klTon(KL_ALLE[n.note].freq, n.dauer, true);
      klBlitz(n.note);
    }

    if (!klVorspiel && n.wer === klIchBin && n.stand === "offen" && dt < -KL_GUT) {
      if (window.klNoteMelden) window.klNoteMelden(klSong.noten.indexOf(n), null);
      n.stand = "verpasst";
      n.el.classList.add("verpasst");
      klUrteil("Verpasst", "#e08a8a");
      klStandAnzeigen();
      setTimeout(() => { n.el.style.display = "none"; }, 500);
    }
    if (n.stand === "verpasst" && dt < -700) n.el.style.display = "none";
  });

  // Wessen Phrase läuft gerade
  if (!klVorspiel) {
    const naechste = klSong.noten.find((n) => n.zeit > t - 200);
    klBau.wer.textContent = naechste
      ? (naechste.wer === klIchBin ? "deine Noten sind hell" : "")
      : "";
  }

  if (t > klSong.laenge + 900) { klBeenden(); return; }
  klSchleife = requestAnimationFrame(klSchritt);
}

function klEingabe(note) {
  if (!klavierOffen) return;
  klBlitz(note);
  if (!klLaeuft || klVorspiel) { klTon(KL_ALLE[note].freq, 400, true); return; }

  const t = performance.now() - klStart;
  let beste = null, abstand = Infinity;
  klSong.noten.forEach((n) => {
    if (n.stand !== "offen" || n.wer !== klIchBin || n.note !== note) return;
    const d = Math.abs(n.zeit - t);
    if (d > KL_GUT) return;
    if (d < abstand) { beste = n; abstand = d; }   // die nächstgelegene gewinnt
  });

  if (beste) {
    beste.stand = "getroffen";
    beste.el.classList.add("getroffen");
    if (window.klNoteMelden) {
      window.klNoteMelden(klSong.noten.indexOf(beste), abstand <= KL_PERFEKT);
    }
    setTimeout(() => { beste.el.style.display = "none"; }, 320);
    klTon(KL_ALLE[note].freq, beste.dauer);
    if (abstand <= KL_PERFEKT) { klPunkte += 100; klUrteil("Perfekt", "#8fd49a"); }
    else                       { klPunkte += 80;  klUrteil("Gut", "#f0c173"); }
    klStandAnzeigen();
  } else {
    // Danebengegriffen: der Ton kommt trotzdem, leise — man hört den Fehler
    klTon(KL_ALLE[note].freq, 350, true);
  }
}

function klBeenden() {
  klLaeuft = false;
  KL_PARTNER.beenden();
  if (klSchleife) cancelAnimationFrame(klSchleife);
  klSchleife = null;
  klBau.feld.querySelectorAll(".kl-note").forEach((n) => n.remove());
  klBau.wer.textContent = "";
  if (klVorspiel) { klTafelStart(); return; }
  klTafelEnde(Math.round((klPunkte / klMoeglich) * 100));
}

// ----------------------------------------------------------------------
// Tasten
// ----------------------------------------------------------------------
addEventListener("keydown", (e) => {
  if (!klavierOffen) return;
  if (e.repeat) return;
  const t = e.key.toLowerCase();
  if (t === "escape") { klavierSchliessen(); e.preventDefault(); return; }
  const note = KL_VON_TASTE[t];
  if (note) { klEingabe(note); e.preventDefault(); }
});


// ======================================================================
// Der Mitspieler über die Leitung
//
//    Der Tastendruck selbst geht nie hinaus — jeder bewertet bei sich,
//    sonst entscheidet die Verzögerung über das Spiel. Hinaus gehen nur
//    der gemeinsame Startzeitpunkt und pro Note ein Ergebnis.
//
//    Ohne Kanal bleibt KL_PARTNER der Übungspartner von oben.
// ======================================================================
(function echterPartner() {
  if (!KANAL_NAME || typeof supabase === "undefined") return;

  let kanal = null, melderFn = null, meinStart = 0;

  try {
    const klient = supabase.createClient(NETZ_URL, NETZ_SCHLUESSEL);
    kanal = klient.channel(KANAL_NAME);

    kanal.on("broadcast", { event: "note" }, ({ payload }) => {
      if (!payload || payload.von === ICH || !melderFn) return;
      melderFn(payload.i, payload.gut === null ? null : !!payload.gut);
    });

    kanal.subscribe();
  } catch (e) { return; }

  // Das eigene Ergebnis hinausgeben. Wird aus klEingabe heraus gerufen,
  // nachdem dort schon bewertet wurde.
  window.klNoteMelden = function (i, gut) {
    if (!kanal) return;
    try {
      kanal.send({ type: "broadcast", event: "note",
                   payload: { von: ICH, i: i, gut: gut } });
    } catch (e) {}
  };

  KL_PARTNER.name = "dein Mitspieler";
  KL_PARTNER.starten = function (song, melden, startZeit) {
    melderFn = melden;
    meinStart = startZeit;
  };
  KL_PARTNER.beenden = function () { melderFn = null; losFn = null; bereitDa = false; };

  // Gemeinsam anfangen. Jeder meldet "bereit". Wer die kleinere Kennung
  // hat, gibt danach das Zeichen — so entscheidet nicht der Zufall,
  // sondern eine feste Regel, auf die beide von selbst kommen.
  let losFn = null, bereitDa = false, schonLos = false;
  const ichGebeDasZeichen = String(ICH) < String(PARTNER_ID);

  kanal.on("broadcast", { event: "bereit" }, ({ payload }) => {
    if (!payload || payload.von === ICH) return;
    bereitDa = true;
    pruefenObLos();
  });

  kanal.on("broadcast", { event: "los" }, ({ payload }) => {
    if (!payload || payload.von === ICH || ichGebeDasZeichen) return;
    anfangen();
  });

  function anfangen() {
    if (schonLos || !losFn) return;
    schonLos = true;
    const f = losFn; losFn = null;
    f();
  }

  function pruefenObLos() {
    if (!losFn || !bereitDa || !ichGebeDasZeichen) return;
    try { kanal.send({ type: "broadcast", event: "los", payload: { von: ICH } }); }
    catch (e) {}
    anfangen();
  }

  KL_PARTNER.abstimmen = function (beiLos) {
    losFn = beiLos;
    schonLos = false;
    try { kanal.send({ type: "broadcast", event: "bereit", payload: { von: ICH } }); }
    catch (e) {}
    pruefenObLos();
    // Falls der andere nie meldet, nach zehn Sekunden allein anfangen
    setTimeout(anfangen, 10000);
    return true;
  };
})();

klSeiteBestimmen(PARTNER_ID);
klavierStarten();

})();
</script>
