<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Villa Victoria</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0b0b0a; color: #e8e4da;
         font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
  #huelle { max-width: 1400px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 22px; font-weight: 500; margin: 0 0 4px; }
  p.unter { color: #8a857a; font-size: 14px; margin: 0 0 24px; }

  /* Brief */
  #brief { position: relative; width: 100%; aspect-ratio: 16 / 9;
           background: #1b1710 center/cover no-repeat;
           border: 1px solid #2a2720; border-radius: 10px; overflow: hidden; }
  #brieftext { position: absolute; left: 12%; top: 12%; width: 52%; max-height: 74%;
               overflow: auto; font-family: "Palatino", Georgia, serif; font-style: italic;
               font-size: clamp(13px, 1.5vw, 19px); line-height: 1.75; color: #2a2118; }
  #brief.ohnebild #brieftext { color: #ded6c2; }
  #briefnachsatz { margin-top: 1.4em; font-size: 0.85em; opacity: .85; }
  #briefknopf { position: absolute; right: 4%; bottom: 6%; padding: 12px 22px;
                background: #221b10; color: #f0c173; border: 1px solid #5a4a1c;
                border-radius: 6px; font-size: 16px; cursor: pointer; }

  /* Namenswahl */
  .namensknopf { display: block; width: 100%; max-width: 360px; margin: 0 0 8px;
    padding: 14px 18px; text-align: left; background: #17160f; color: #e8e4da;
    border: 1px solid #332f24; border-radius: 8px; font-size: 16px; cursor: pointer; }
  .namensknopf:hover { background: #221f16; border-color: #5a5238; }

  /* Kopfzeile */
  #kopf { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 12px; }
  .raumknopf { padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 14px;
    background: #17160f; color: #e8e4da; border: 1px solid #332f24; }
  .raumknopf.aktiv { border-color: #c88a2a; color: #f0c173; }
  .raumknopf:disabled { opacity: .35; cursor: not-allowed; }
  #wer { margin-left: auto; font-size: 13px; color: #8a857a; }

  /* Raumbild */
  #buehne { position: relative; width: 100%; aspect-ratio: 16 / 9;
    background: #131210 center/cover no-repeat; border: 1px solid #2a2720;
    border-radius: 10px; overflow: hidden; user-select: none; }
  .stelle { position: absolute; cursor: pointer; }
  .stelle.genommen { cursor: default; background: rgba(0,0,0,0.5); border-radius: 4px; }
  .stelle .marke { position: absolute; left: 0; right: 0; bottom: 2px; text-align: center;
    font-size: 11px; color: #9a927e; pointer-events: none; }

  /* Nahansicht */
  #nah { position: absolute; inset: 0; background: #0b0b0a center/cover no-repeat; display: none; }
  #nah img.portrait { position: absolute; object-fit: cover; }
  #nahzu { position: absolute; right: 12px; top: 12px; padding: 8px 16px;
    background: #17160f; color: #e8e4da; border: 1px solid #5a5238;
    border-radius: 6px; font-size: 14px; cursor: pointer; z-index: 2; }

  /* Textfenster */
  #fenster { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
    max-width: 620px; width: calc(100% - 32px); background: #16150f;
    border: 1px solid #4a4230; border-radius: 8px; padding: 14px 18px;
    font-size: 15px; line-height: 1.55; display: none; z-index: 3; }
  #fenster .fragment { display: inline-block; margin-top: 10px; padding: 8px 18px;
    background: #3a2f12; color: #f0c173; border-radius: 6px; font-size: 22px; letter-spacing: 3px; }
  #fenster button { float: right; background: none; border: none; color: #8a857a;
    font-size: 20px; cursor: pointer; line-height: 1; }

  /* Tür */
  #tuer { margin-top: 16px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #tuer input { padding: 10px 14px; background: #131210; color: #e8e4da;
    border: 1px solid #332f24; border-radius: 6px; font-size: 18px;
    letter-spacing: 6px; width: 180px; text-align: center; }
  #tuer button { padding: 10px 18px; background: #3a2f12; color: #f0c173;
    border: 1px solid #5a4a1c; border-radius: 6px; font-size: 15px; cursor: pointer; }
  #tuertext { font-size: 14px; color: #8a857a; }

  #tasche { display: none; margin-top: 16px; padding: 14px 18px;
    background: #16150f; border: 1px solid #5a4a1c; border-radius: 8px; max-width: 420px; }
  .taschenzeile { font-size: 13px; color: #8a857a; }
  .taschenname { font-size: 19px; color: #e8e4da; margin: 4px 0 8px; }
  .taschenzahl { display: inline-block; margin-bottom: 8px; padding: 6px 18px;
    background: #3a2f12; color: #f0c173; border-radius: 6px; font-size: 24px; letter-spacing: 3px; }

  #funde { margin-top: 16px; font-size: 14px; color: #8a857a; line-height: 1.7; }
  #funde b { color: #e8e4da; font-weight: 500; }

  #editor { margin-top: 16px; display: none; }
  #editor textarea { width: 100%; height: 160px; background: #0f0e0c; color: #a9d6a0;
    border: 1px solid #332f24; border-radius: 6px; padding: 10px;
    font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
  #ziehrahmen { position: absolute; border: 1px dashed #f0c173;
    background: rgba(240,193,115,0.12); display: none; z-index: 4; }
  #editor-an .stelle { outline: 1px dashed rgba(240,193,115,0.45); }
</style>
</head>
<body>
<div id="huelle">

  <div id="briefseite">
    <div id="brief">
      <div id="brieftext"></div>
      <button id="briefknopf">Die Tür steht offen</button>
    </div>
  </div>

  <div id="namenswahl" style="display:none">
    <h1>Villa Victoria</h1>
    <p class="unter">Wer bist du?</p>
    <div id="namensliste"></div>
  </div>

  <div id="spiel" style="display:none">
    <div id="kopf"></div>
    <div id="buehne">
      <div id="ziehrahmen"></div>
      <div id="nah"><button id="nahzu">Zurück</button></div>
      <div id="fenster"></div>
    </div>
    <div id="tasche"></div>
    <div id="tuer"></div>
    <div id="funde"></div>
    <div id="editor"><textarea id="editorfeld" readonly></textarea></div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// ======================================================================

// ======================================================================

const SPIELER = ["bin.sen", "cat", "murloc", "riva", "tsag", "spatz", "Knox"];

// ======================================================================

const BRIEF = {

  absaetze: [

// ======================================================================
// 4. Die Porträtwand
//    HAENGUNG ist die Reihenfolge der Rahmen:
//    oben links, oben Mitte, oben rechts, unten links, unten Mitte, unten rechts.
//    Diese Reihenfolge bestimmt die Reihenfolge der Ziffern im Türcode.
// ======================================================================
const HAENGUNG = ["Viktor", "Maryama", "Delsyn", "Lucia", "Jack", "Logan"];

const PORTRAITS = {
  Delsyn:  "bilder/portraits/delsyn.jpg",
  Logan:   "bilder/portraits/logan.jpg",
  Jack:    "bilder/portraits/jack.jpg",
  Viktor:  "bilder/portraits/viktor.jpg",
  Maryama: "bilder/portraits/maryama.jpg",
  Lucia:   "bilder/portraits/lucia.jpg"
};

// Innenflächen der sechs Rahmen im Bild bilder/portraitwand.jpg, in Prozent.
const RAHMEN = [
  { x: 27.0, y: 9.4,  w: 12.4, h: 28.5 },
  { x: 43.7, y: 9.4,  w: 12.4, h: 28.5 },
  { x: 60.2, y: 9.4,  w: 12.6, h: 28.5 },
  { x: 27.0, y: 43.6, w: 12.4, h: 29.1 },
  { x: 43.7, y: 43.6, w: 12.4, h: 29.1 },
  { x: 60.2, y: 43.6, w: 12.6, h: 29.1 }
];

// ======================================================================
// 5. Räume
//    x, y, w, h sind Prozentwerte im Bild (links, oben, Breite, Höhe).
//    Eine Stelle mit "ziffer" ist ein Fundstück, eine ohne nur Stimmung.
//    Die Raum-Kennungen müssen zu den Zeilen in der Tabelle raeume passen.
// ======================================================================
const RAEUME = [
  {
    id: "eingangshalle",
    name: "Die Halle",
    bild: "bilder/halle.jpg",
    loesung: "316498",
    naechster: "bibliothek",
    tuertext: "Im Schloss der Tür sitzen sechs Walzen. Sie wollen Zahlen.",
    stellen: [
      // --- Fundstücke -------------------------------------------------
      { id: "wachs", x: 12, y: 67, w: 7, h: 11, ziffer: "6", gehoert: "Delsyn", name: "Hundemarke",
        text: "Halb im erkalteten Wachs liegt eine Hundemarke an einer Kette. Die Prägung ist noch zu lesen. Am Kettenglied hängt ein Papierschild mit einer Zahl." },
      { id: "truhe", x: 18, y: 58, w: 7, h: 10, ziffer: "1", gehoert: "Maryama", name: "Getrocknetes Blatt",
        text: "In der offenen Truhe liegt ein getrocknetes Blatt zwischen zwei Glasscheiben. Mit Faden umwickelt, daran ein Papierschild mit einer Zahl." },
      { id: "leinwaende", x: 34, y: 43, w: 8, h: 13, ziffer: "8", gehoert: "Logan", name: "Plektrum",
        text: "Zwischen den angelehnten Leinwänden klemmt ein abgegriffenes Plektrum. Jemand hat ein Papierschild daran geklebt, darauf eine Zahl." },
      { id: "sofa", x: 41, y: 59, w: 11, h: 7, ziffer: "9", gehoert: "Jack", name: "Haarbürste",
        text: "Unter dem Kissen steckt eine Haarbürste. In den Borsten hängen noch Haare. Am Griff ein Papierschild mit einer Zahl." },
      { id: "sims", x: 73, y: 42, w: 17, h: 6, ziffer: "3", gehoert: "Viktor", name: "Katzenspielzeug",
        text: "Auf dem Kaminsims liegt ein Katzenspielzeug, die Feder daran ist zerzaust. An der Schnur hängt ein Papierschild mit einer Zahl." },
      { id: "spiegelfuss", x: 90, y: 70, w: 8, h: 11, ziffer: "4", gehoert: "Lucia", name: "Phiole",
        text: "Am Fuss des Spiegels steht eine kleine Phiole, der Verschluss aus Wachs. Was darin ist, ist dunkel und noch nicht eingetrocknet. Am Hals ein Papierschild mit einer Zahl." },

      // --- Porträtwand ------------------------------------------------
      { id: "portraits", x: 52, y: 14, w: 13, h: 22, nahansicht: "bilder/portraitwand.jpg",
        text: "Sechs Rahmen über der Tür." },

      // --- Stimmung ---------------------------------------------------
      { id: "schild",    x: 24, y: 5,  w: 14, h: 14, text: "Ein verblichenes Schild. Der Name darauf ist nicht mehr zu entziffern." },
      { id: "vorhang",   x: 24, y: 25, w: 8,  h: 26, text: "Der Vorhang bewegt sich. Die Fenster dahinter sind vernagelt." },
      { id: "saeule",    x: 15, y: 15, w: 7,  h: 45, text: "Die Säule ist bis in Schulterhöhe zerkratzt. Von innen." },
      { id: "tuerblatt", x: 55, y: 38, w: 7,  h: 28, text: "Die Tür ist verschlossen. Im Schloss sitzen sechs kleine Walzen." },
      { id: "flasche",   x: 71, y: 62, w: 4,  h: 7,  text: "Eine umgekippte Flasche. Der Inhalt ist längst eingetrocknet." },
      { id: "feuer",     x: 80, y: 55, w: 7,  h: 12, text: "Das Feuer brennt. Niemand hat es angezündet." },
      { id: "spiegel",   x: 91, y: 28, w: 8,  h: 38, text: "Du siehst dich darin. Eine Sekunde zu spät." },
      { id: "krimskrams",x: 83, y: 42, w: 6,  h: 5,  text: "Nippes auf dem Sims. Alles mit der Vorderseite zur Wand gedreht." },
      { id: "teppich",   x: 44, y: 78, w: 14, h: 10, text: "Der Teppich ist an einer Stelle dunkel. Es ist kein Wein." }
    ]
  },
  {
    id: "bibliothek",
    name: "Die Bibliothek",
    bild: "",
    loesung: "",
    naechster: "keller",
    tuertext: "Noch leer.",
    stellen: []
  },
  {
    id: "keller",
    name: "Der Keller",
    bild: "",
    loesung: "",
    naechster: "",
    tuertext: "Noch leer.",
    stellen: []
  }
];

// ======================================================================
// Ab hier Technik
// ======================================================================
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const bearbeiten = new URLSearchParams(location.search).has("edit");

let ich = localStorage.getItem("spukhaus_spieler") || "";
let raumId = "";
let funde = [];
let raumStatus = {};
let anwesend = [];
let kanalRaum = null;

const el = (id) => document.getElementById(id);

// --- Brief -------------------------------------------------------------
function briefZeigen() {
  const b = el("brief");
  if (BRIEF.bild) { b.style.backgroundImage = `url("${BRIEF.bild}")`; }
  else { b.classList.add("ohnebild"); }
  el("brieftext").innerHTML =
    BRIEF.absaetze.map((a) => `<p>${a}</p>`).join("") +
    (BRIEF.nachsatz ? `<div id="briefnachsatz">${BRIEF.nachsatz}</div>` : "");
  el("briefknopf").onclick = () => {
    el("briefseite").style.display = "none";
    if (ich && SPIELER.includes(ich)) starten(); else namenswahlZeigen();
  };
}

// --- Namenswahl --------------------------------------------------------
function namenswahlZeigen() {
  el("namenswahl").style.display = "block";
  const liste = el("namensliste");
  liste.innerHTML = "";
  SPIELER.forEach((name) => {
    const k = document.createElement("button");
    k.className = "namensknopf";
    k.textContent = name;
    k.onclick = () => { ich = name; localStorage.setItem("spukhaus_spieler", name); starten(); };
    liste.appendChild(k);
  });
}

function spielerWechseln() {
  if (kanalRaum) { db.removeChannel(kanalRaum); kanalRaum = null; }
  ich = "";
  localStorage.removeItem("spukhaus_spieler");
  el("spiel").style.display = "none";
  namenswahlZeigen();
}

async function starten() {
  el("namenswahl").style.display = "none";
  el("spiel").style.display = "block";
  if (bearbeiten) { el("editor").style.display = "block"; el("huelle").id = "huelle"; document.body.id = "editor-an"; }
  await ladeRaeume();
  await ladeFunde();
  horchen();
  const offener = RAEUME.find((r) => raumStatus[r.id]);
  raumWechseln(offener ? offener.id : RAEUME[0].id);
}

// --- Daten -------------------------------------------------------------
async function ladeRaeume() {
  const { data, error } = await db.from("raeume").select("raum, offen");
  if (error) { meldung("Räume konnten nicht geladen werden: " + error.message); return; }
  raumStatus = {};
  data.forEach((z) => { raumStatus[z.raum] = z.offen; });
}

async function ladeFunde() {
  const { data, error } = await db.from("funde").select("id, raum, stelle, spieler, fragment");
  if (error) { meldung("Funde konnten nicht geladen werden: " + error.message); return; }
  funde = data;
}

function horchen() {
  db.channel("spukhaus-daten")
    .on("postgres_changes", { event: "*", schema: "public", table: "funde" }, (n) => {
      if (n.eventType === "INSERT") funde.push(n.new);
      if (n.eventType === "DELETE") funde = funde.filter((f) => f.id !== n.old.id);
      zeichnen();
    })
    .on("postgres_changes", { event: "*", schema: "public", table: "raeume" }, (n) => {
      raumStatus[n.new.raum] = n.new.offen;
      zeichnen();
    })
    .subscribe();
}

function anwesenheit(raum) {
  if (kanalRaum) db.removeChannel(kanalRaum);
  kanalRaum = db.channel("raum-" + raum, { config: { presence: { key: ich } } });
  kanalRaum
    .on("presence", { event: "sync" }, () => {
      anwesend = Object.keys(kanalRaum.presenceState());
      zeichnen();
    })
    .subscribe(async (status) => {
      if (status === "SUBSCRIBED") await kanalRaum.track({ name: ich });
    });
}

// --- Raumwechsel -------------------------------------------------------
function raumWechseln(id) {
  raumId = id;
  const raum = RAEUME.find((r) => r.id === id);
  el("buehne").style.backgroundImage = raum.bild ? `url("${raum.bild}")` : "none";
  nahZu();
  fensterZu();
  anwesenheit(id);
  zeichnen();
}

// --- Zeichnen ----------------------------------------------------------
function zeichnen() {
  const raum = RAEUME.find((r) => r.id === raumId);
  if (!raum) return;

  const kopf = el("kopf");
  kopf.innerHTML = "";
  RAEUME.forEach((r) => {
    const k = document.createElement("button");
    k.className = "raumknopf" + (r.id === raumId ? " aktiv" : "");
    k.textContent = r.name;
    k.disabled = !raumStatus[r.id];
    k.onclick = () => raumWechseln(r.id);
    kopf.appendChild(k);
  });
  const wer = document.createElement("div");
  wer.id = "wer";
  wer.textContent = "Im Raum: " + (anwesend.length ? anwesend.join(", ") : "nur du");
  kopf.appendChild(wer);

  const wechseln = document.createElement("button");
  wechseln.className = "raumknopf";
  wechseln.textContent = ich + " — wechseln";
  wechseln.onclick = spielerWechseln;
  kopf.appendChild(wechseln);

  const buehne = el("buehne");
  buehne.querySelectorAll(".stelle").forEach((n) => n.remove());

  const hier = funde.filter((f) => f.raum === raumId);
  const meinFund = hier.find((f) => f.spieler === ich);

  raum.stellen.forEach((s) => {
    const belegt = hier.find((f) => f.stelle === s.id);
    const d = document.createElement("div");
    d.className = "stelle" + (belegt ? " genommen" : "");
    d.style.left = s.x + "%"; d.style.top = s.y + "%";
    d.style.width = s.w + "%"; d.style.height = s.h + "%";
    if (belegt) {
      const m = document.createElement("div");
      m.className = "marke";
      m.textContent = belegt.spieler;
      d.appendChild(m);
    } else {
      d.onclick = () => stelleAnklicken(s, meinFund);
    }
    buehne.appendChild(d);
  });

  const tuer = el("tuer");
  tuer.innerHTML = "";
  if (raum.loesung) {
    const t = document.createElement("div");
    t.id = "tuertext";
    t.textContent = raumStatus[raum.naechster] ? "Die Tür steht offen." : raum.tuertext;
    tuer.appendChild(t);
    if (!raumStatus[raum.naechster]) {
      const feld = document.createElement("input");
      feld.placeholder = "······";
      feld.maxLength = raum.loesung.length;
      const knopf = document.createElement("button");
      knopf.textContent = "Drehen";
      knopf.onclick = () => tuerVersuchen(raum, feld.value);
      feld.onkeydown = (e) => { if (e.key === "Enter") tuerVersuchen(raum, feld.value); };
      tuer.appendChild(feld);
      tuer.appendChild(knopf);
    }
  }

  const tasche = el("tasche");
  if (meinFund) {
    const s = raum.stellen.find((st) => st.id === meinFund.stelle);
    tasche.innerHTML = `<div class="taschenzeile">Du trägst bei dir</div>` +
      `<div class="taschenname">${s && s.name ? s.name : "Etwas"}</div>` +
      `<div class="taschenzahl">${meinFund.fragment}</div>` +
      `<div class="taschenzeile">Nur du siehst das. Erzähl es den anderen.</div>`;
    tasche.style.display = "block";
  } else {
    tasche.style.display = "none";
  }

  const liste = el("funde");
  const offen = SPIELER.filter((p) => anwesend.includes(p) && !hier.some((f) => f.spieler === p));
  liste.innerHTML = hier.length
    ? hier.map((f) => `<b>${f.spieler}</b> hat etwas gefunden`).join("<br>")
    : "Noch hat niemand etwas gefunden.";
  if (offen.length) liste.innerHTML += `<br>Noch ohne Fund: ${offen.join(", ")}`;
}

// --- Klick -------------------------------------------------------------
async function stelleAnklicken(stelle, meinFund) {
  if (stelle.nahansicht) { nahZeigen(stelle.nahansicht); return; }
  if (!stelle.ziffer) { fensterZeigen(stelle.text, null); return; }
  if (meinFund) {
    fensterZeigen("Du trägst schon etwas aus diesem Raum. Lass den anderen den Rest.", null);
    return;
  }
  const { error } = await db.from("funde").insert({
    raum: raumId, stelle: stelle.id, spieler: ich, fragment: stelle.ziffer
  });
  if (error) {
    if (error.code === "23505") {
      fensterZeigen("Zu spät. Jemand war schneller.", null);
      await ladeFunde(); zeichnen();
    } else {
      fensterZeigen("Fehler: " + error.message, null);
    }
    return;
  }
  fensterZeigen(stelle.text, stelle.ziffer);
}

// --- Tür ---------------------------------------------------------------
async function tuerVersuchen(raum, eingabe) {
  const code = (eingabe || "").trim();
  if (!code) { meldung("Erst die Walzen stellen."); return; }
  if (code !== raum.loesung) { meldung("Die Walzen rasten nicht ein."); return; }
  const { error } = await db.from("raeume")
    .update({ offen: true, geoeffnet_von: ich, zeit: new Date().toISOString() })
    .eq("raum", raum.naechster);
  if (error) { meldung("Fehler: " + error.message); return; }
  raumStatus[raum.naechster] = true;
  zeichnen();
  meldung("Das Schloss gibt nach. Die Tür schwingt auf.");
}

// --- Nahansicht --------------------------------------------------------
function nahZeigen(pfad) {
  const n = el("nah");
  n.querySelectorAll("img.portrait").forEach((i) => i.remove());
  n.style.backgroundImage = `url("${pfad}")`;
  HAENGUNG.forEach((figur, i) => {
    const quelle = PORTRAITS[figur];
    const rahmen = RAHMEN[i];
    if (!quelle || !rahmen) return;
    const bild = document.createElement("img");
    bild.className = "portrait";
    bild.src = quelle;
    bild.alt = figur;
    bild.style.left = rahmen.x + "%";
    bild.style.top = rahmen.y + "%";
    bild.style.width = rahmen.w + "%";
    bild.style.height = rahmen.h + "%";
    n.appendChild(bild);
  });
  n.style.display = "block";
}
function nahZu() { el("nah").style.display = "none"; }
el("nahzu").onclick = (e) => { e.stopPropagation(); nahZu(); };

// --- Textfenster -------------------------------------------------------
function fensterZeigen(text, ziffer) {
  const f = el("fenster");
  f.innerHTML = "<button onclick='fensterZu()'>×</button>" + text +
    (ziffer ? `<br><span class="fragment">${ziffer}</span>` : "");
  f.style.display = "block";
}
function fensterZu() { el("fenster").style.display = "none"; }
function meldung(t) { fensterZeigen(t, null); }

// --- Bearbeitungsmodus -------------------------------------------------
// Seite mit ?edit aufrufen. Rechteck über eine Stelle ziehen, unten steht
// die fertige Zeile. Ist die Nahansicht offen, beziehen sich die Werte
// auf die Nahansicht, sonst auf das Raumbild.
if (bearbeiten) {
  let start = null;
  document.addEventListener("mousedown", (e) => {
    if (!el("buehne").contains(e.target)) return;
    if (e.target.id === "nahzu") return;
    const r = el("buehne").getBoundingClientRect();
    start = { x: e.clientX - r.left, y: e.clientY - r.top, r };
    const z = el("ziehrahmen");
    z.style.display = "block";
    z.style.left = start.x + "px"; z.style.top = start.y + "px";
    z.style.width = "0px"; z.style.height = "0px";
    e.preventDefault();
  });
  document.addEventListener("mousemove", (e) => {
    if (!start) return;
    const z = el("ziehrahmen");
    const x = e.clientX - start.r.left, y = e.clientY - start.r.top;
    z.style.left = Math.min(x, start.x) + "px";
    z.style.top = Math.min(y, start.y) + "px";
    z.style.width = Math.abs(x - start.x) + "px";
    z.style.height = Math.abs(y - start.y) + "px";
  });
  document.addEventListener("mouseup", (e) => {
    if (!start) return;
    const r = start.r;
    const x = e.clientX - r.left, y = e.clientY - r.top;
    const links = Math.min(x, start.x), oben = Math.min(y, start.y);
    const breit = Math.abs(x - start.x), hoch = Math.abs(y - start.y);
    start = null;
    el("ziehrahmen").style.display = "none";
    if (breit < 8 || hoch < 8) return;
    const p = (v, ganz) => Math.round((v / ganz) * 1000) / 10;
    const inNah = el("nah").style.display === "block";
    const zeile = inNah
      ? `{ x: ${p(links, r.width)}, y: ${p(oben, r.height)}, w: ${p(breit, r.width)}, h: ${p(hoch, r.height)} },`
      : `{ id: "neu", x: ${p(links, r.width)}, y: ${p(oben, r.height)}, w: ${p(breit, r.width)}, h: ${p(hoch, r.height)}, text: "" },`;
    const feld = el("editorfeld");
    feld.value += (feld.value ? "\n" : "") + zeile;
    feld.scrollTop = feld.scrollHeight;
  });
}
