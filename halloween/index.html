// ======================================================================
// Ab hier Technik
// ======================================================================
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const abfrage = new URLSearchParams(location.search);
const bearbeiten = abfrage.has("edit");
// Nur mit ?admin am Ende der Adresse erscheint der Knopf zum Spielerwechsel.
const admin = abfrage.has("admin") || bearbeiten;

// Name aus der Adresse, zum Beispiel ...index.html?spieler=cat
// Gross- und Kleinschreibung spielt keine Rolle.
const ausLink = (abfrage.get("spieler") || "").trim().toLowerCase();
const trefferImLink = SPIELER.find((n) => n.toLowerCase() === ausLink);

let ich = trefferImLink || localStorage.getItem("spukhaus_spieler") || "";
if (trefferImLink) localStorage.setItem("spukhaus_spieler", trefferImLink);
let raumId = "";
let funde = [];
let raumStatus = {};
let anwesend = [];
let kanalRaum = null;
let reservierungen = [];
let offenesRaetsel = null;

const el = (id) => document.getElementById(id);

// --- Brief -------------------------------------------------------------
function briefZeigen() {
  const b = el("brief");
  if (BRIEF.bild) { b.style.backgroundImage = `url("${BRIEF.bild}")`; }
  else { b.classList.add("ohnebild"); }
  el("brieftext").innerHTML =
    BRIEF.absaetze.map((a) => `<p>${a}</p>`).join("") +
    (BRIEF.nachsatz ? `<div id="briefnachsatz">${BRIEF.nachsatz}</div>` : "");
  el("briefknopf").onclick = () => {
    el("briefseite").style.display = "none";
    if (ich && SPIELER.includes(ich)) starten(); else namenswahlZeigen();
  };
}

// --- Namenswahl --------------------------------------------------------
function namenswahlZeigen() {
  el("namenswahl").style.display = "block";
  const liste = el("namensliste");
  liste.innerHTML = "";
  SPIELER.forEach((name) => {
    const k = document.createElement("button");
    k.className = "namensknopf";
    k.textContent = name;
    k.onclick = () => {
      if (!confirm("Du spielst als " + name + ". Das lässt sich danach nicht mehr ändern.")) return;
      ich = name;
      localStorage.setItem("spukhaus_spieler", name);
      starten();
    };
    liste.appendChild(k);
  });
}

function spielerWechseln() {
  if (kanalRaum) { db.removeChannel(kanalRaum); kanalRaum = null; }
  ich = "";
  localStorage.removeItem("spukhaus_spieler");
  el("spiel").style.display = "none";
  namenswahlZeigen();
}

async function starten() {
  el("namenswahl").style.display = "none";
  el("spiel").style.display = "block";
  if (bearbeiten) { el("editor").style.display = "block"; el("huelle").id = "huelle"; document.body.id = "editor-an"; }
  await ladeRaeume();
  await ladeFunde();
  await ladeReservierungen();
  horchen();
  const offener = RAEUME.find((r) => raumStatus[r.id]);
  raumWechseln(offener ? offener.id : RAEUME[0].id);
}

// --- Daten -------------------------------------------------------------
async function ladeRaeume() {
  const { data, error } = await db.from("raeume").select("raum, offen");
  if (error) { meldung("Räume konnten nicht geladen werden: " + error.message); return; }
  raumStatus = {};
  data.forEach((z) => { raumStatus[z.raum] = z.offen; });
}

async function ladeReservierungen() {
  const { data, error } = await db.from("reservierungen").select("raum, stelle, spieler, zeit");
  if (error) { reservierungen = []; return; }
  reservierungen = data;
}

function frisch(r) {
  return (Date.now() - new Date(r.zeit).getTime()) < 5 * 60 * 1000;
}

async function ladeFunde() {
  const { data, error } = await db.from("funde").select("id, raum, stelle, spieler, fragment");
  if (error) { meldung("Funde konnten nicht geladen werden: " + error.message); return; }
  funde = data;
}

function horchen() {
  db.channel("spukhaus-daten")
    .on("postgres_changes", { event: "*", schema: "public", table: "funde" }, (n) => {
      if (n.eventType === "INSERT") funde.push(n.new);
      if (n.eventType === "DELETE") funde = funde.filter((f) => f.id !== n.old.id);
      zeichnen();
    })
    .on("postgres_changes", { event: "*", schema: "public", table: "raeume" }, (n) => {
      raumStatus[n.new.raum] = n.new.offen;
      zeichnen();
    })
    .on("postgres_changes", { event: "*", schema: "public", table: "reservierungen" }, async () => {
      await ladeReservierungen();
      zeichnen();
    })
    .subscribe();
}

function anwesenheit(raum) {
  if (kanalRaum) db.removeChannel(kanalRaum);
  kanalRaum = db.channel("raum-" + raum, { config: { presence: { key: ich } } });
  kanalRaum
    .on("presence", { event: "sync" }, () => {
      anwesend = Object.keys(kanalRaum.presenceState());
      zeichnen();
    })
    .subscribe(async (status) => {
      if (status === "SUBSCRIBED") await kanalRaum.track({ name: ich });
    });
}

// --- Raumwechsel -------------------------------------------------------
function raumWechseln(id) {
  raumId = id;
  const raum = RAEUME.find((r) => r.id === id);
  el("buehne").style.backgroundImage = raum.bild ? `url("${raum.bild}")` : "none";
  schlossZu();
  nahZu();
  el("raetsel").style.display = "none";
  fensterZu();
  anwesenheit(id);
  zeichnen();
}

// --- Zeichnen ----------------------------------------------------------
function zeichnen() {
  const raum = RAEUME.find((r) => r.id === raumId);
  if (!raum) return;

  const kopf = el("kopf");
  kopf.innerHTML = "";
  RAEUME.forEach((r) => {
    const k = document.createElement("button");
    k.className = "raumknopf" + (r.id === raumId ? " aktiv" : "");
    k.textContent = r.name;
    k.disabled = !raumStatus[r.id];
    k.onclick = () => raumWechseln(r.id);
    kopf.appendChild(k);
  });
  const wer = document.createElement("div");
  wer.id = "wer";
  wer.textContent = "Im Raum: " + (anwesend.length ? anwesend.join(", ") : "nur du");
  kopf.appendChild(wer);

  if (admin) {
    const wechseln = document.createElement("button");
    wechseln.className = "raumknopf";
    wechseln.textContent = ich + " — wechseln";
    wechseln.onclick = spielerWechseln;
    kopf.appendChild(wechseln);
  } else {
    const name = document.createElement("div");
    name.id = "wer";
    name.style.marginLeft = "0";
    name.textContent = "Du bist " + ich;
    kopf.appendChild(name);
  }

  const buehne = el("buehne");
  buehne.querySelectorAll(".stelle").forEach((n) => n.remove());

  const hier = funde.filter((f) => f.raum === raumId);
  const meinFund = hier.find((f) => f.spieler === ich);

  raum.stellen.forEach((s) => {
    const belegt = hier.find((f) => f.stelle === s.id);
    const d = document.createElement("div");
    d.className = "stelle" + (belegt ? " genommen" : "");
    d.style.left = s.x + "%"; d.style.top = s.y + "%";
    d.style.width = s.w + "%"; d.style.height = s.h + "%";
    const besetzt = reservierungen.find(
      (r) => r.raum === raumId && r.stelle === s.id && r.spieler !== ich && frisch(r)
    );
    if (belegt) {
      const m = document.createElement("div");
      m.className = "marke";
      m.textContent = belegt.spieler;
      d.appendChild(m);
    } else if (besetzt) {
      const m = document.createElement("div");
      m.className = "marke";
      m.textContent = besetzt.spieler + " rätselt";
      d.appendChild(m);
      d.classList.add("genommen");
    } else {
      if (s.schloss && raum.naechster && raumStatus[raum.naechster]) {
        const pf = document.createElement("div");
        pf.className = "pfeil";
        pf.textContent = "→";
        d.appendChild(pf);
      }
      d.onclick = () => stelleAnklicken(s, meinFund);
    }
    buehne.appendChild(d);
  });

  const tuer = el("tuer");
  tuer.innerHTML = "";
  if (raum.loesung) {
    const t = document.createElement("div");
    t.id = "tuertext";
    t.textContent = raumStatus[raum.naechster]
      ? "Die Tür steht offen. Klick sie an, um hindurchzugehen."
      : "Die Tür ist verschlossen. Klick sie an, um am Schloss zu drehen.";
    tuer.appendChild(t);
  }

  const tasche = el("tasche");
  if (meinFund) {
    const st = raum.stellen.find((x) => x.id === meinFund.stelle);
    tasche.innerHTML = `<div class="taschenzeile">Dein Inventar in diesem Raum — nur du siehst es</div>` +
      `<div class="taschenunten">` +
        (st && st.bild ? `<img class="taschenbild" src="${st.bild}" alt="">` : "") +
        `<span class="taschenname">${st && st.name ? st.name : "Etwas"}</span>` +
        `<span class="taschenzahl">${meinFund.fragment}</span>` +
      `</div>`;
    tasche.onclick = () => {
      if (st) fensterZeigen(st.text, meinFund.fragment, st.bild);
    };
    tasche.style.display = "block";
  } else {
    tasche.style.display = "none";
  }

  const liste = el("funde");
  const offen = SPIELER.filter((p) => anwesend.includes(p) && !hier.some((f) => f.spieler === p));
  liste.innerHTML = hier.length
    ? hier.map((f) => `<b>${f.spieler}</b> hat etwas gefunden`).join("<br>")
    : "Noch hat niemand etwas gefunden.";
  if (offen.length) liste.innerHTML += `<br>Noch ohne Fund: ${offen.join(", ")}`;
}

// --- Klick -------------------------------------------------------------
async function stelleAnklicken(stelle, meinFund) {
  if (stelle.schloss) {
    const raum = RAEUME.find((r) => r.id === raumId);
    if (raum.naechster && raumStatus[raum.naechster]) { raumWechseln(raum.naechster); return; }
    schlossZeigen();
    return;
  }
  if (stelle.raetsel) { raetselStarten(stelle, meinFund); return; }
  if (stelle.nahansicht) { nahZeigen(stelle.nahansicht); return; }
  if (!stelle.ziffer) { fensterZeigen(stelle.text, null); return; }
  if (meinFund) {
    fensterZeigen("Du trägst schon etwas aus diesem Raum. Lass den anderen den Rest.", null);
    return;
  }
  const { error } = await db.from("funde").insert({
    raum: raumId, stelle: stelle.id, spieler: ich, fragment: stelle.ziffer
  });
  if (error) {
    if (error.code === "23505") {
      fensterZeigen("Zu spät. Jemand war schneller.", null);
      await ladeFunde(); zeichnen();
    } else {
      fensterZeigen("Fehler: " + error.message, null);
    }
    return;
  }
  fensterZeigen(stelle.text, stelle.ziffer, stelle.bild);
}

// --- Rätsel ------------------------------------------------------------
async function raetselStarten(stelle, meinFund) {
  if (meinFund) {
    fensterZeigen("Du trägst schon etwas aus diesem Raum. Lass den anderen den Rest.", null);
    return;
  }
  const besetzt = reservierungen.find(
    (r) => r.raum === raumId && r.stelle === stelle.id && r.spieler !== ich && frisch(r)
  );
  if (besetzt) {
    fensterZeigen(besetzt.spieler + " sitzt gerade an dieser Aufgabe. Such dir eine andere.", null);
    return;
  }
  // eigene alte Reservierung in diesem Raum freigeben
  await db.from("reservierungen").delete().eq("raum", raumId).eq("spieler", ich);
  // abgelaufene Reservierung dieser Stelle entfernen
  await db.from("reservierungen").delete().eq("raum", raumId).eq("stelle", stelle.id);
  const { error } = await db.from("reservierungen")
    .insert({ raum: raumId, stelle: stelle.id, spieler: ich });
  if (error) {
    fensterZeigen("Jemand war schneller. Such dir eine andere Aufgabe.", null);
    await ladeReservierungen(); zeichnen();
    return;
  }
  await ladeReservierungen();
  offenesRaetsel = stelle;
  raetselZeigen(stelle);
  zeichnen();
}

async function raetselSchliessen() {
  if (offenesRaetsel) {
    await db.from("reservierungen").delete().eq("raum", raumId).eq("spieler", ich);
    offenesRaetsel = null;
    await ladeReservierungen();
  }
  el("raetsel").style.display = "none";
  zeichnen();
}

async function raetselGeloest(stelle) {
  const { error } = await db.from("funde").insert({
    raum: raumId, stelle: stelle.id, spieler: ich, fragment: stelle.nr
  });
  await db.from("reservierungen").delete().eq("raum", raumId).eq("spieler", ich);
  offenesRaetsel = null;
  await ladeReservierungen();
  el("raetsel").style.display = "none";
  if (error) {
    fensterZeigen(error.code === "23505"
      ? "Zu spät. Jemand war schneller."
      : "Fehler: " + error.message, null);
    await ladeFunde();
  } else {
    fensterZeigen(
      "Gelöst. " + stelle.text +
      `<br><br>Du nimmst an dich: <b>${stelle.name}</b>`,
      stelle.nr, stelle.bild);
  }
  zeichnen();
}

function raetselZeigen(stelle) {
  const d = RAETSEL[stelle.raetsel];
  const k = el("raetsel");
  k.innerHTML =
    `<button class="zurueck" id="raetselzu">Zurück</button>` +
    `<h2>${d.titel}</h2>` +
    `<div class="aufgabe">${d.aufgabe}</div>` +
    `<div id="raetselkoerper"></div>` +
    `<div id="raetselmeldung"></div>`;
  k.style.display = "block";
  el("raetselzu").onclick = raetselSchliessen;
  const koerper = el("raetselkoerper");

  if (stelle.raetsel === "puzzle") { bastlePuzzle(koerper, stelle, d); return; }
  if (stelle.raetsel === "unterschiede") { bastleUnterschiede(koerper, stelle, d); return; }
  if (stelle.raetsel === "gitter") { bastleGitter(koerper, stelle, d); return; }

  let vorbau = "";
  if (stelle.raetsel === "anagramm") {
    vorbau = `<div class="anagramm">${d.gemischt}</div>`;
  }
  if (stelle.raetsel === "geheimschrift") {
    vorbau = `<div class="chiffre">${d.chiffre}</div>` +
      `<div class="tabelle">` +
      d.tabelle.map(([z, b]) => `<span class="${b === "?" ? "leer" : ""}">${z} = ${b}</span>`).join("") +
      `</div><div class="aufgabe">${d.hinweis}</div>`;
  }
  koerper.innerHTML = vorbau +
    `<div class="antwort">` +
      `<input id="raetselfeld" autocomplete="off" placeholder="Antwort">` +
      `<button id="raetselpruefen">Prüfen</button>` +
    `</div>`;
  const feld = el("raetselfeld");
  feld.focus();
  const pruefen = () => {
    const ein = (feld.value || "").trim().toUpperCase();
    if (!ein) return;
    const ohneLeer = (t) => t.replace(/\s+/g, "");
    if (ohneLeer(ein) === ohneLeer(d.loesung.toUpperCase())) { raetselGeloest(stelle); return; }
    if (stelle.raetsel === "zaehlen") {
      const zahl = parseInt(ein, 10);
      if (!isNaN(zahl)) {
        el("raetselmeldung").textContent =
          zahl < parseInt(d.loesung, 10) ? "Es sind mehr." : "Es sind weniger.";
        return;
      }
    }
    el("raetselmeldung").textContent = "Das stimmt nicht.";
  };
  el("raetselpruefen").onclick = pruefen;
  feld.onkeydown = (e) => { if (e.key === "Enter") pruefen(); };
}

// --- Buchstabengitter --------------------------------------------------
function bastleGitter(koerper, stelle, d) {
  const zeilen = d.zeilen, N = zeilen[0].length;
  const gefunden = new Set();        // gefundene Namen
  const markiert = new Set();        // Felder "r,c"
  let start = null;

  koerper.innerHTML = `<div class="gitter" id="gitterfeld"></div>` +
    `<div class="namensliste2" id="gitternamen"></div>`;
  const feld = el("gitterfeld");
  feld.style.gridTemplateColumns = `repeat(${N}, 1fr)`;

  function namenMalen() {
    el("gitternamen").innerHTML = d.namen
      .map((n) => `<span class="${gefunden.has(n) ? "weg" : ""}">${n}</span>`).join("");
  }

  function wegLesen(r1, c1, r2, c2) {
    const dr = Math.sign(r2 - r1), dc = Math.sign(c2 - c1);
    const schritte = Math.max(Math.abs(r2 - r1), Math.abs(c2 - c1));
    // nur gerade Linien: waagrecht, senkrecht oder diagonal
    if (!(r1 === r2 || c1 === c2 || Math.abs(r2 - r1) === Math.abs(c2 - c1))) return null;
    const wege = [];
    let wort = "";
    for (let i = 0; i <= schritte; i++) {
      const r = r1 + dr * i, c = c1 + dc * i;
      wort += zeilen[r][c];
      wege.push(r + "," + c);
    }
    return { wort, wege };
  }

  function malen() {
    feld.innerHTML = "";
    zeilen.forEach((zeile, r) => {
      [...zeile].forEach((buchstabe, c) => {
        const z = document.createElement("span");
        z.textContent = buchstabe;
        if (markiert.has(r + "," + c)) z.classList.add("gefunden");
        if (start && start.r === r && start.c === c) z.classList.add("start");
        z.onclick = () => {
          if (!start) { start = { r, c }; malen(); return; }
          if (start.r === r && start.c === c) { start = null; malen(); return; }
          const weg = wegLesen(start.r, start.c, r, c);
          start = null;
          if (!weg) {
            el("raetselmeldung").textContent = "Nur gerade Linien.";
            malen(); return;
          }
          const rueckwaerts = [...weg.wort].reverse().join("");
          const treffer = d.namen.find((n) => !gefunden.has(n) && (n === weg.wort || n === rueckwaerts));
          if (!treffer) {
            el("raetselmeldung").textContent = "Das ist keines der Wörter.";
            malen(); return;
          }
          gefunden.add(treffer);
          weg.wege.forEach((f) => markiert.add(f));
          el("raetselmeldung").textContent = "";
          malen(); namenMalen();
          if (gefunden.size === d.namen.length) satzFragen();
        };
        feld.appendChild(z);
      });
    });
  }
  function satzFragen() {
    const kasten = document.createElement("div");
    kasten.innerHTML =
      `<div class="aufgabe" style="margin-top:14px">${d.satzfrage}</div>` +
      `<div class="antwort">` +
        `<input id="satzfeld" autocomplete="off" placeholder="Der Satz" style="width:340px">` +
        `<button id="satzpruefen">Prüfen</button>` +
      `</div>`;
    koerper.appendChild(kasten);
    const sf = el("satzfeld");
    sf.focus();
    const ohne = (t) => t.toUpperCase().replace(/[^A-ZÄÖÜ]/g, "");
    const pruefen = () => {
      if (ohne(sf.value || "") === ohne(d.loesung)) { raetselGeloest(stelle); return; }
      el("raetselmeldung").textContent = "So ergibt das keinen Satz.";
    };
    el("satzpruefen").onclick = pruefen;
    sf.onkeydown = (e) => { if (e.key === "Enter") pruefen(); };
  }

  malen(); namenMalen();
}

// --- Puzzle (Schiebespiel) ---------------------------------------------
function bastlePuzzle(koerper, stelle, d) {
  const N = d.raster || 3, anzahl = N * N, leer = anzahl - 1;
  let felder = [...Array(anzahl).keys()];   // felder[platz] = kachel, leer = leeres Feld

  function nachbarn(platz) {
    const r = Math.floor(platz / N), c = platz % N, raus = [];
    if (r > 0) raus.push(platz - N);
    if (r < N - 1) raus.push(platz + N);
    if (c > 0) raus.push(platz - 1);
    if (c < N - 1) raus.push(platz + 1);
    return raus;
  }
  // Durch zufällige, erlaubte Züge mischen — so bleibt es immer lösbar
  let leerPlatz = felder.indexOf(leer);
  for (let i = 0; i < (d.zuege || 35); i++) {
    const m = nachbarn(leerPlatz);
    const ziel = m[Math.floor(Math.random() * m.length)];
    felder[leerPlatz] = felder[ziel];
    felder[ziel] = leer;
    leerPlatz = ziel;
  }

  const raster = document.createElement("div");
  raster.className = "kacheln";
  raster.style.gridTemplateColumns = `repeat(${N}, 1fr)`;
  koerper.appendChild(raster);

  function fertig() { return felder.every((v, i) => v === i); }

  function malen() {
    raster.innerHTML = "";
    felder.forEach((kachel, platz) => {
      const z = document.createElement("div");
      if (kachel === leer) {
        z.className = "leerfeld";
      } else {
        const sp = kachel % N, ze = Math.floor(kachel / N);
        z.style.backgroundImage = `url("${d.bild}")`;
        z.style.backgroundSize = `${N * 100}% ${N * 100}%`;
        z.style.backgroundPosition = `${(sp * 100) / (N - 1)}% ${(ze * 100) / (N - 1)}%`;
        z.onclick = () => {
          const lp = felder.indexOf(leer);
          if (!nachbarn(platz).includes(lp)) return;
          felder[lp] = felder[platz];
          felder[platz] = leer;
          malen();
          if (fertig()) raetselGeloest(stelle);
        };
      }
      raster.appendChild(z);
    });
  }
  malen();
}

// --- Unterschiede ------------------------------------------------------
function bastleUnterschiede(koerper, stelle, d) {
  if (!d.punkte || d.punkte.length === 0) {
    koerper.innerHTML = `<div class="aufgabe" style="margin-top:14px">` +
      `Dieses Rätsel ist noch nicht fertig. Die beiden Bilder fehlen.</div>`;
    return;
  }
  const gefunden = new Set();
  koerper.innerHTML =
    `<div class="unterschiede">` +
      `<div class="seite"><img src="${d.links}" alt=""></div>` +
      `<div class="seite" id="seiteRechts"><img src="${d.rechts}" alt=""></div>` +
    `</div>` +
    `<div class="aufgabe" id="standUnterschiede" style="margin-top:10px"></div>`;
  const rechts = el("seiteRechts");
  const stand = el("standUnterschiede");
  const anzeigen = () => {
    stand.textContent = gefunden.size + " von " + d.punkte.length + " gefunden.";
  };
  anzeigen();
  rechts.onclick = (e) => {
    const r = rechts.getBoundingClientRect();
    const x = ((e.clientX - r.left) / r.width) * 100;
    const y = ((e.clientY - r.top) / r.height) * 100;
    d.punkte.forEach((pkt, i) => {
      if (gefunden.has(i)) return;
      const dx = x - pkt.x, dy = (y - pkt.y) * (r.height / r.width);
      if (Math.sqrt(dx * dx + dy * dy) <= pkt.r) {
        gefunden.add(i);
        const marke = document.createElement("div");
        marke.className = "punkt";
        marke.style.left = (pkt.x - pkt.r) + "%";
        marke.style.top = (pkt.y - pkt.r * (r.width / r.height)) + "%";
        marke.style.width = (pkt.r * 2) + "%";
        marke.style.height = (pkt.r * 2 * (r.width / r.height)) + "%";
        rechts.appendChild(marke);
        anzeigen();
        if (gefunden.size === d.punkte.length) raetselGeloest(stelle);
      }
    });
  };
}

// --- Schloss -----------------------------------------------------------
function schlossZeigen() {
  const raum = RAEUME.find((r) => r.id === raumId);
  const k = el("schloss");
  if (!raum.loesung) { fensterZeigen("Diese Tür hat kein Schloss.", null); return; }
  if (raumStatus[raum.naechster]) {
    fensterZeigen("Die Tür steht offen. Dahinter wartet der nächste Raum.", null);
    return;
  }
  k.innerHTML =
    `<div class="schlosszeile">${raum.tuertext}</div>` +
    `<input id="schlossfeld" maxlength="${raum.loesung.length}" placeholder="······" autocomplete="off">` +
    `<div class="reihe">` +
      `<button id="schlossdrehen">Drehen</button>` +
      `<button id="schlossweg" class="weg">Zurück</button>` +
    `</div>` +
    `<div id="schlossmeldung"></div>`;
  k.style.display = "block";
  const feld = el("schlossfeld");
  feld.focus();
  feld.onkeydown = (e) => { if (e.key === "Enter") schlossVersuchen(); };
  el("schlossdrehen").onclick = schlossVersuchen;
  el("schlossweg").onclick = schlossZu;
}
function schlossZu() { el("schloss").style.display = "none"; }

async function schlossVersuchen() {
  const raum = RAEUME.find((r) => r.id === raumId);
  const feld = el("schlossfeld");
  const meldungsfeld = el("schlossmeldung");
  const code = (feld.value || "").trim();
  if (!code) { meldungsfeld.textContent = "Erst die Walzen stellen."; return; }
  if (code.toUpperCase() !== raum.loesung.toUpperCase()) {
    meldungsfeld.textContent = "Die Walzen rasten nicht ein.";
    feld.value = "";
    feld.focus();
    return;
  }
  const { error } = await db.from("raeume")
    .update({ offen: true, geoeffnet_von: ich, zeit: new Date().toISOString() })
    .eq("raum", raum.naechster);
  if (error) { meldungsfeld.textContent = "Fehler: " + error.message; return; }
  raumStatus[raum.naechster] = true;
  schlossZu();
  zeichnen();
  fensterZeigen("Das Schloss gibt nach. Die Tür schwingt auf — für alle.", null);
}

// --- Nahansicht --------------------------------------------------------
function nahZeigen(pfad) {
  const n = el("nah");
  n.querySelectorAll("img.portrait").forEach((i) => i.remove());
  n.style.backgroundImage = `url("${pfad}")`;
  HAENGUNG.forEach((figur, i) => {
    const quelle = PORTRAITS[figur];
    const rahmen = RAHMEN[i];
    if (!quelle || !rahmen) return;
    const bild = document.createElement("img");
    bild.className = "portrait";
    bild.src = quelle;
    bild.alt = figur;
    bild.style.left = rahmen.x + "%";
    bild.style.top = rahmen.y + "%";
    bild.style.width = rahmen.w + "%";
    bild.style.height = rahmen.h + "%";
    n.appendChild(bild);
  });
  n.style.display = "block";
}
function nahZu() { el("nah").style.display = "none"; }
el("nahzu").onclick = (e) => { e.stopPropagation(); nahZu(); };

// --- Textfenster -------------------------------------------------------
function fensterZeigen(text, ziffer, bild) {
  const f = el("fenster");
  const inhalt = text + (ziffer ? `<br><span class="fragment">${ziffer}</span>` : "");
  f.innerHTML = "<button onclick='fensterZu()'>×</button>" +
    (bild ? `<div class="fundzeile"><img class="fundbild" src="${bild}" alt=""><div>${inhalt}</div></div>`
          : inhalt);
  f.style.display = "block";
}
function fensterZu() { el("fenster").style.display = "none"; }
function meldung(t) { fensterZeigen(t, null); }

// --- Bearbeitungsmodus -------------------------------------------------
// Seite mit ?edit aufrufen. Rechteck über eine Stelle ziehen, unten steht
// die fertige Zeile. Ist die Nahansicht offen, beziehen sich die Werte
// auf die Nahansicht, sonst auf das Raumbild.
if (bearbeiten) {
  let start = null;
  document.addEventListener("mousedown", (e) => {
    if (!el("buehne").contains(e.target)) return;
    if (e.target.id === "nahzu") return;
    const r = el("buehne").getBoundingClientRect();
    start = { x: e.clientX - r.left, y: e.clientY - r.top, r };
    const z = el("ziehrahmen");
    z.style.display = "block";
    z.style.left = start.x + "px"; z.style.top = start.y + "px";
    z.style.width = "0px"; z.style.height = "0px";
    e.preventDefault();
  });
  document.addEventListener("mousemove", (e) => {
    if (!start) return;
    const z = el("ziehrahmen");
    const x = e.clientX - start.r.left, y = e.clientY - start.r.top;
    z.style.left = Math.min(x, start.x) + "px";
    z.style.top = Math.min(y, start.y) + "px";
    z.style.width = Math.abs(x - start.x) + "px";
    z.style.height = Math.abs(y - start.y) + "px";
  });
  document.addEventListener("mouseup", (e) => {
    if (!start) return;
    const r = start.r;
    const x = e.clientX - r.left, y = e.clientY - r.top;
    const links = Math.min(x, start.x), oben = Math.min(y, start.y);
    const breit = Math.abs(x - start.x), hoch = Math.abs(y - start.y);
    start = null;
    el("ziehrahmen").style.display = "none";
    if (breit < 8 || hoch < 8) return;
    const p = (v, ganz) => Math.round((v / ganz) * 1000) / 10;
    const inNah = el("nah").style.display === "block";
    const zeile = inNah
      ? `{ x: ${p(links, r.width)}, y: ${p(oben, r.height)}, w: ${p(breit, r.width)}, h: ${p(hoch, r.height)} },`
      : `{ id: "neu", x: ${p(links, r.width)}, y: ${p(oben, r.height)}, w: ${p(breit, r.width)}, h: ${p(hoch, r.height)}, text: "" },`;
    const feld = el("editorfeld");
    feld.value += (feld.value ? "\n" : "") + zeile;
    feld.scrollTop = feld.scrollHeight;
  });
}
